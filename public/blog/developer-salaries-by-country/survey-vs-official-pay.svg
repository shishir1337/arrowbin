  <rect x="130" y="260.0" width="160" height="300.0" rx="10" fill="#3b2bff"/>
  <text x="210" y="246.0" font-size="28" font-weight="700" fill="#0e0b24" text-anchor="middle">$155,000</text>
  <text x="210" y="594" font-size="22" fill="#4a4766" text-anchor="middle">Developer survey</text>
  <rect x="360" y="300.6" width="160" height="259.4" rx="10" fill="#cfc4ff"/>
