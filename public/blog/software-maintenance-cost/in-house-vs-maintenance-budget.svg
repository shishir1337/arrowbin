<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">One in-house developer vs a year of upkeep</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">Yearly cost in US dollars</text>

  <!-- grid: $0 to $200,000, x 440 to 1180 (3.7 px per $1,000) -->
  <g stroke="#e4e4e7" stroke-width="2">
    <line x1="440" y1="180" x2="440" y2="570"/>
    <line x1="625" y1="180" x2="625" y2="570"/>
    <line x1="810" y1="180" x2="810" y2="570"/>
    <line x1="995" y1="180" x2="995" y2="570"/>
    <line x1="1180" y1="180" x2="1180" y2="570"/>
  </g>
  <g font-size="18" fill="#4a4766" text-anchor="middle">
    <text x="440" y="600">$0</text>
    <text x="625" y="600">$50k</text>
    <text x="810" y="600">$100k</text>
    <text x="995" y="600">$150k</text>
    <text x="1180" y="600">$200k</text>
  </g>

  <!-- row labels -->
  <g font-size="22" font-weight="700" fill="#0e0b24">
    <text x="80" y="246">One developer (US)</text>
    <text x="80" y="376">SaaS platform upkeep</text>
    <text x="80" y="456">Mid-size app upkeep</text>
    <text x="80" y="536">$60,000 SaaS MVP upkeep</text>
  </g>
  <g font-size="18" fill="#4a4766">
    <text x="80" y="272">BLS median pay plus benefits</text>
    <text x="80" y="402">Arrowbin estimate</text>
    <text x="80" y="482">Arrowbin estimate</text>
    <text x="80" y="562">Arrowbin estimate</text>
  </g>

  <!-- developer: salary $134,040 (496 px) + benefits about $57,400 (212 px) -->
  <text x="1148" y="214" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="end">About $191,000 a year</text>
  <rect x="440" y="226" width="496" height="52" rx="8" fill="#3b2bff"/>
  <rect x="938" y="226" width="210" height="52" rx="8" fill="#cfc4ff"/>
  <text x="460" y="260" font-size="20" font-weight="700" fill="#ffffff">Salary $134,040</text>
  <text x="954" y="260" font-size="20" font-weight="700" fill="#0e0b24">Benefits ~$57,000</text>

  <!-- maintenance ranges -->
  <rect x="484" y="356" width="104" height="40" rx="8" fill="#ff4da6"/>
  <rect x="457" y="436" width="50" height="40" rx="8" fill="#ff4da6"/>
  <rect x="473" y="516" width="12" height="40" rx="4" fill="#ff4da6"/>
  <g font-size="22" font-weight="700" fill="#0e0b24">
    <text x="604" y="383">$12,000–$40,000</text>
    <text x="523" y="463">$4,500–$18,000</text>
    <text x="501" y="543">$9,000–$12,000</text>
  </g>

  <!-- callout -->
  <rect x="800" y="420" width="380" height="120" rx="18" fill="#F1F2F7"/>
  <text x="824" y="466" font-size="22" font-weight="700" fill="#0e0b24">One developer costs about</text>
  <text x="824" y="496" font-size="22" font-weight="700" fill="#0e0b24">16 to 21 years of upkeep</text>
  <text x="824" y="524" font-size="18" fill="#4a4766">for the $60,000 SaaS MVP</text>

  <text x="80" y="650" font-size="18" fill="#4a4766">Salary: BLS median pay for software developers, QA analysts and testers, May 2025.</text>
  <text x="80" y="678" font-size="18" fill="#4a4766">Benefits: our calculation from the 30.0% benefits share in the BLS employer cost survey, June 2026.</text>
</svg>
