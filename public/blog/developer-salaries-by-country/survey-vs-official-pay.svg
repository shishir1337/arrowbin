  <text x="320" y="640" font-size="26" font-weight="700" fill="#ff4da6" text-anchor="middle">Survey median is 16% higher</text>
  <text x="940" y="186" font-size="30" font-weight="700" fill="#0e0b24" text-anchor="middle">United Kingdom</text>
  <rect x="750" y="260.0" width="160" height="300.0" rx="10" fill="#3b2bff"/>
  <text x="830" y="246.0" font-size="28" font-weight="700" fill="#0e0b24" text-anchor="middle">£70,000</text>
  <text x="830" y="594" font-size="22" fill="#4a4766" text-anchor="middle">Developer survey</text>
  <rect x="980" y="316.1" width="160" height="243.9" rx="10" fill="#cfc4ff"/>
  <text x="1060" y="302.1" font-size="28" font-weight="700" fill="#0e0b24" text-anchor="middle">£56,914</text>
