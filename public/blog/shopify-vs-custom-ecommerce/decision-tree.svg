<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="80" font-size="40" font-weight="700" fill="#0e0b24">Shopify, WooCommerce or custom?</text>
  <text x="80" y="118" font-size="24" fill="#4a4766">Three questions that settle most platform decisions</text>

  <!-- connectors -->
  <g stroke="#4a4766" stroke-width="3" fill="none">
    <path d="M640 236 V266 H330 V300"/>
    <path d="M640 266 H950 V300"/>
    <path d="M330 386 V414 H195 V446"/>
    <path d="M330 414 H465 V446"/>
    <path d="M950 386 V414 H815 V446"/>
    <path d="M950 414 H1085 V446"/>
  </g>
  <g font-size="20" font-weight="700" fill="#0e0b24" text-anchor="middle">
    <rect x="452" y="248" width="56" height="30" rx="15" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <text x="480" y="270">Yes</text>
    <rect x="772" y="248" width="56" height="30" rx="15" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <text x="800" y="270">No</text>
    <rect x="234" y="400" width="56" height="30" rx="15" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <text x="262" y="422">Yes</text>
    <rect x="370" y="400" width="56" height="30" rx="15" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <text x="398" y="422">No</text>
    <rect x="854" y="400" width="56" height="30" rx="15" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <text x="882" y="422">Yes</text>
    <rect x="990" y="400" width="56" height="30" rx="15" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <text x="1018" y="422">No</text>
  </g>

  <!-- question 1 -->
  <rect x="320" y="156" width="640" height="80" rx="16" fill="#F1F2F7" stroke="#3b2bff" stroke-width="3"/>
  <g font-size="22" font-weight="600" fill="#0e0b24" text-anchor="middle">
    <text x="640" y="190">Do your products, pricing and checkout</text>
    <text x="640" y="218">fit Shopify plus a few apps?</text>
  </g>

  <!-- question 2 and 3 -->
  <rect x="80" y="300" width="500" height="86" rx="16" fill="#F1F2F7" stroke="#3b2bff" stroke-width="3"/>
  <rect x="700" y="300" width="500" height="86" rx="16" fill="#F1F2F7" stroke="#3b2bff" stroke-width="3"/>
  <g font-size="22" font-weight="600" fill="#0e0b24" text-anchor="middle">
    <text x="330" y="336">Already on WordPress, with someone</text>
    <text x="330" y="364">to keep plugins patched?</text>
    <text x="950" y="336">Can checkout and payments</text>
    <text x="950" y="364">stay on Shopify?</text>
  </g>

  <!-- outcomes -->
  <rect x="70" y="446" width="250" height="116" rx="16" fill="#ffd23f"/>
  <rect x="340" y="446" width="250" height="116" rx="16" fill="#3b2bff"/>
  <rect x="690" y="446" width="250" height="116" rx="16" fill="#cfc4ff"/>
  <rect x="960" y="446" width="250" height="116" rx="16" fill="#ff4da6"/>
  <g text-anchor="middle">
    <text x="195" y="490" font-size="26" font-weight="700" fill="#0e0b24">WooCommerce</text>
    <text x="195" y="520" font-size="18" fill="#0e0b24">Budget for plugin</text>
    <text x="195" y="544" font-size="18" fill="#0e0b24">and hosting upkeep</text>

    <text x="465" y="490" font-size="26" font-weight="700" fill="#ffffff">Shopify</text>
    <text x="465" y="520" font-size="18" fill="#ffffff">Launch now, then</text>
    <text x="465" y="544" font-size="18" fill="#ffffff">revisit once a year</text>

    <text x="815" y="490" font-size="26" font-weight="700" fill="#0e0b24">Headless Shopify</text>
    <text x="815" y="520" font-size="18" fill="#0e0b24">Your own front end,</text>
    <text x="815" y="544" font-size="18" fill="#0e0b24">Shopify's checkout</text>

    <text x="1085" y="490" font-size="26" font-weight="700" fill="#0e0b24">Custom store</text>
    <text x="1085" y="520" font-size="18" fill="#0e0b24">Build $30k–$90k,</text>
    <text x="1085" y="544" font-size="18" fill="#0e0b24">then 15–20% a year</text>
  </g>

  <text x="80" y="630" font-size="20" fill="#0e0b24">Still on the fence? Start on Shopify. A clean Shopify store is one of the easier things to move later.</text>
  <text x="80" y="664" font-size="18" fill="#4a4766">Custom budget: Arrowbin estimate from our published cost guide, not a quote.</text>
</svg>
