<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="80" font-size="40" font-weight="700" fill="#0e0b24">What one feature adds to an Android app</text>
  <text x="80" y="118" font-size="24" fill="#4a4766">One Bangladeshi vendor's published estimates, in Taka (US dollars in brackets)</text>

  <!-- whole basic Android app band: Tk 1.5-3 lakh, x 540-720 (120px per lakh from x=360) -->
  <rect x="540" y="174" width="180" height="372" fill="#cfc4ff" opacity="0.45"/>
  <text x="630" y="162" font-size="18" font-weight="600" fill="#0e0b24" text-anchor="middle">Whole basic Android app: Tk 1.5–3 lakh</text>

  <g stroke="#e4e4e7" stroke-width="2">
    <line x1="360" y1="174" x2="360" y2="548"/>
    <line x1="480" y1="174" x2="480" y2="548"/>
    <line x1="600" y1="174" x2="600" y2="548"/>
    <line x1="720" y1="174" x2="720" y2="548"/>
    <line x1="840" y1="174" x2="840" y2="548"/>
  </g>
  <g font-size="19" font-weight="600" fill="#0e0b24" text-anchor="middle">
    <text x="360" y="576">Tk 0</text>
    <text x="480" y="576">1 lakh</text>
    <text x="600" y="576">2 lakh</text>
    <text x="720" y="576">3 lakh</text>
    <text x="840" y="576">4 lakh</text>
  </g>
  <g font-size="18" fill="#4a4766" text-anchor="middle">
    <text x="360" y="600">$0</text>
    <text x="480" y="600">$809</text>
    <text x="600" y="600">$1,617</text>
    <text x="720" y="600">$2,426</text>
    <text x="840" y="600">$3,235</text>
  </g>

  <!-- row labels -->
  <g font-size="20" font-weight="600" fill="#0e0b24">
    <text x="80" y="207">Push notifications</text>
    <text x="80" y="253">Login system</text>
    <text x="80" y="299">Payment gateway</text>
    <text x="80" y="345">UI/UX design</text>
    <text x="80" y="391">Location tracking</text>
    <text x="80" y="437">Chat and messaging</text>
    <text x="80" y="483">E-commerce module</text>
    <text x="80" y="529">Admin panel</text>
  </g>

  <!-- bars -->
  <g fill="#3b2bff">
    <rect x="378" y="187" width="30" height="26" rx="5"/>
    <rect x="384" y="233" width="72" height="26" rx="5"/>
    <rect x="408" y="279" width="96" height="26" rx="5"/>
    <rect x="396" y="325" width="144" height="26" rx="5"/>
    <rect x="420" y="371" width="180" height="26" rx="5"/>
    <rect x="456" y="417" width="204" height="26" rx="5"/>
    <rect x="456" y="463" width="264" height="26" rx="5"/>
  </g>
  <rect x="456" y="509" width="384" height="26" rx="5" fill="#ff4da6"/>
  <path d="M844 510 l14 12 l-14 12 z" fill="#ff4da6"/>

  <!-- value labels -->
  <g font-size="18" fill="#0e0b24">
    <text x="880" y="206">Tk 15,000–40,000 ($120–320)</text>
    <text x="880" y="252">Tk 20,000–80,000 ($160–650)</text>
    <text x="880" y="298">Tk 40,000–1.2 lakh ($320–970)</text>
    <text x="880" y="344">Tk 30,000–1.5 lakh ($240–1,210)</text>
    <text x="880" y="390">Tk 50,000–2 lakh ($400–1,620)</text>
    <text x="880" y="436">Tk 80,000–2.5 lakh ($650–2,020)</text>
    <text x="880" y="482">Tk 80,000–3 lakh ($650–2,430)</text>
    <text x="880" y="528" font-weight="700">Tk 80,000–4 lakh+ ($650–3,240+)</text>
  </g>

  <text x="80" y="664" font-size="19" fill="#0e0b24">Each bar is one feature's price range on its own. USD at Tk 123.65 (Bangladesh Bank, Oct 19, 2026).</text>
  <text x="80" y="694" font-size="18" fill="#4a4766">Source: bdtask.com app development cost guide, Android feature table (updated Jun 28, 2026)</text>
</svg>
