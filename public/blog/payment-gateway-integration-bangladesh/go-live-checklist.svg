<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="64" y="84" font-size="40" font-weight="700" fill="#0e0b24">Go-live checklist for a Bangladeshi checkout</text>
  <text x="64" y="124" font-size="24" fill="#4a4766">Pass every line in sandbox before real money moves</text>

  <!-- cards -->
  <g fill="#F1F2F7">
    <rect x="64" y="160" width="560" height="104" rx="18"/>
    <rect x="64" y="280" width="560" height="104" rx="18"/>
    <rect x="64" y="400" width="560" height="104" rx="18"/>
    <rect x="64" y="520" width="560" height="104" rx="18"/>
    <rect x="656" y="160" width="560" height="104" rx="18"/>
    <rect x="656" y="280" width="560" height="104" rx="18"/>
    <rect x="656" y="400" width="560" height="104" rx="18"/>
    <rect x="656" y="520" width="560" height="104" rx="18"/>
  </g>

  <!-- check boxes -->
  <g>
    <rect x="92" y="190" width="44" height="44" rx="10" fill="#3b2bff"/>
    <rect x="92" y="310" width="44" height="44" rx="10" fill="#3b2bff"/>
    <rect x="92" y="430" width="44" height="44" rx="10" fill="#3b2bff"/>
    <rect x="92" y="550" width="44" height="44" rx="10" fill="#3b2bff"/>
    <rect x="684" y="190" width="44" height="44" rx="10" fill="#ff4da6"/>
    <rect x="684" y="310" width="44" height="44" rx="10" fill="#ff4da6"/>
    <rect x="684" y="430" width="44" height="44" rx="10" fill="#ff4da6"/>
    <rect x="684" y="550" width="44" height="44" rx="10" fill="#ff4da6"/>
  </g>
  <g stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M103 212 111 220 126 204"/>
    <path d="M103 332 111 340 126 324"/>
    <path d="M103 452 111 460 126 444"/>
    <path d="M103 572 111 580 126 564"/>
    <path d="M695 212 703 220 718 204"/>
    <path d="M695 332 703 340 718 324"/>
    <path d="M695 452 703 460 718 444"/>
    <path d="M695 572 703 580 718 564"/>
  </g>

  <!-- left column: payment integrity -->
  <g font-size="20" font-weight="700" fill="#0e0b24">
    <text x="160" y="204">Sandbox: success, fail, cancel</text>
    <text x="160" y="324">Gateway notification (IPN)</text>
    <text x="160" y="444">Amount, currency, order ID</text>
    <text x="160" y="564">Each payment applied once</text>
  </g>
  <g font-size="19" fill="#4a4766">
    <text x="160" y="234">and a timeout, all tested</text>
    <text x="160" y="354">received and validated server-side</text>
    <text x="160" y="474">matched against your database</text>
    <text x="160" y="594">even when callbacks repeat</text>
  </g>

  <!-- right column: operations -->
  <g font-size="20" font-weight="700" fill="#0e0b24">
    <text x="752" y="204">A refund tested end to end</text>
    <text x="752" y="324">Daily reconciliation</text>
    <text x="752" y="444">Cash on delivery confirmed</text>
    <text x="752" y="564">Secrets on the server only</text>
  </g>
  <g font-size="19" fill="#4a4766">
    <text x="752" y="234">including a partial refund</text>
    <text x="752" y="354">against the settlement report</text>
    <text x="752" y="474">by call or SMS before dispatch</text>
    <text x="752" y="594">never in browser code or the repo</text>
  </g>

  <text x="64" y="680" font-size="18" fill="#4a4766">Arrowbin checklist, based on the SSLCommerz v4 and bKash developer docs (checked 15 Oct 2026).</text>
</svg>
