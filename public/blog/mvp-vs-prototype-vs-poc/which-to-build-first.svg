<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="60" y="88" font-size="40" font-weight="700" fill="#0e0b24">Which should you build first?</text>
  <text x="60" y="126" font-size="24" fill="#4a4766">Start with the assumption most likely to sink the idea (Arrowbin view)</text>
  <rect x="60" y="150" width="560" height="104" rx="18" fill="#F1F2F7" stroke="#cfc4ff" stroke-width="2"/>
  <text x="340" y="194" font-size="23" font-weight="700" text-anchor="middle" fill="#0e0b24">Could the hard part fail, or</text>
  <text x="340" y="226" font-size="23" font-weight="700" text-anchor="middle" fill="#0e0b24">cost too much to run?</text>
  <line x1="620" y1="202" x2="742" y2="202" stroke="#3b2bff" stroke-width="3"/>
  <polygon points="756,202 742,194 742,210" fill="#3b2bff"/>
  <text x="690" y="188" font-size="20" font-weight="700" text-anchor="middle" fill="#3b2bff">Yes</text>
  <line x1="340" y1="254" x2="340" y2="268" stroke="#0e0b24" stroke-width="3"/>
  <polygon points="340,282 332,268 348,268" fill="#0e0b24"/>
  <text x="356" y="277" font-size="18" font-weight="700" fill="#0e0b24">No</text>
  <rect x="60" y="284" width="560" height="104" rx="18" fill="#F1F2F7" stroke="#cfc4ff" stroke-width="2"/>
  <text x="340" y="328" font-size="23" font-weight="700" text-anchor="middle" fill="#0e0b24">Is the core flow new, or</text>
  <text x="340" y="360" font-size="23" font-weight="700" text-anchor="middle" fill="#0e0b24">easy to get wrong?</text>
  <line x1="620" y1="336" x2="742" y2="336" stroke="#3b2bff" stroke-width="3"/>
  <polygon points="756,336 742,328 742,344" fill="#3b2bff"/>
  <text x="690" y="322" font-size="20" font-weight="700" text-anchor="middle" fill="#3b2bff">Yes</text>
  <line x1="340" y1="388" x2="340" y2="402" stroke="#0e0b24" stroke-width="3"/>
  <polygon points="340,416 332,402 348,402" fill="#0e0b24"/>
  <text x="356" y="411" font-size="18" font-weight="700" fill="#0e0b24">No</text>
  <rect x="60" y="418" width="560" height="104" rx="18" fill="#F1F2F7" stroke="#cfc4ff" stroke-width="2"/>
  <text x="340" y="464" font-size="23" font-weight="700" text-anchor="middle" fill="#0e0b24">Is demand still unproven?</text>
  <text x="340" y="496" font-size="19" text-anchor="middle" fill="#4a4766">No pre-orders, no paying users yet</text>
  <line x1="620" y1="470" x2="742" y2="470" stroke="#3b2bff" stroke-width="3"/>
  <polygon points="756,470 742,462 742,478" fill="#3b2bff"/>
  <text x="690" y="456" font-size="20" font-weight="700" text-anchor="middle" fill="#3b2bff">Yes</text>
  <line x1="340" y1="522" x2="340" y2="536" stroke="#0e0b24" stroke-width="3"/>
  <polygon points="340,550 332,536 348,536" fill="#0e0b24"/>
  <text x="356" y="545" font-size="18" font-weight="700" fill="#0e0b24">No</text>
  <rect x="760" y="150" width="460" height="104" rx="18" fill="#3b2bff" stroke="#3b2bff" stroke-width="2"/>
  <text x="788" y="188" font-size="26" font-weight="700" fill="#ffffff">Proof of concept</text>
  <text x="788" y="218" font-size="20" fill="#e6e2ff">Test the hard part on its own</text>
  <text x="788" y="243" font-size="18" fill="#cfc4ff">Days to a few weeks (our view)</text>
  <rect x="760" y="284" width="460" height="104" rx="18" fill="#ffe8f3" stroke="#ff4da6" stroke-width="2"/>
  <text x="788" y="322" font-size="26" font-weight="700" fill="#0e0b24">Prototype</text>
  <text x="788" y="352" font-size="20" fill="#0e0b24">Test the flow with about 5 people</text>
  <text x="788" y="377" font-size="18" fill="#4a4766">Days to 2 weeks (Arrowbin estimate)</text>
  <rect x="760" y="418" width="460" height="104" rx="18" fill="#ffffff" stroke="#3b2bff" stroke-width="3"/>
  <text x="788" y="456" font-size="26" font-weight="700" fill="#0e0b24">MVP</text>
  <text x="788" y="486" font-size="20" fill="#0e0b24">One core workflow, real users</text>
  <text x="788" y="511" font-size="18" fill="#4a4766">6–14 weeks (Arrowbin estimate)</text>
  <rect x="60" y="552" width="560" height="104" rx="18" fill="#ffffff" stroke="#ffd23f" stroke-width="4"/>
  <text x="340" y="598" font-size="24" font-weight="700" text-anchor="middle" fill="#0e0b24">Plan the full product</text>
  <text x="340" y="630" font-size="20" text-anchor="middle" fill="#4a4766">You're past the MVP question</text>
  <text x="760" y="598" font-size="20" fill="#4a4766">When a POC or prototype passes,</text>
  <text x="760" y="628" font-size="20" fill="#4a4766">come back and ask the next question.</text>
</svg>
