  <text x="650.0" y="664" font-size="22" fill="#4a4766" text-anchor="middle">$50k</text>
  <text x="900.0" y="664" font-size="22" fill="#4a4766" text-anchor="middle">$100k</text>
  <text x="1150.0" y="664" font-size="22" fill="#4a4766" text-anchor="middle">$150k</text>
  <text x="64" y="704" font-size="22" fill="#4a4766">Countries with 100+ respondents. Source: Stack Overflow Developer Survey 2025 and 2026</text>
