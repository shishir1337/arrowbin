  <circle cx="120" cy="90" r="200" fill="#cfc4ff" opacity="0.35" filter="url(#soft)"/>
  <circle cx="640" cy="760" r="240" fill="#ff4da6" opacity="0.14" filter="url(#soft)"/>
  <circle cx="1220" cy="700" r="170" fill="#ffd23f" opacity="0.3" filter="url(#soft)"/>

