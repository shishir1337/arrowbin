  <text x="940" y="640" font-size="26" font-weight="700" fill="#ff4da6" text-anchor="middle">Survey median is 23% higher</text>
  <line x1="640" y1="160" x2="640" y2="650" stroke="#e4e4e7" stroke-width="3"/>
  <text x="64" y="704" font-size="22" fill="#4a4766">Survey: employed developers, 2025 and 2026 waves. UK figure uses pay entered in pounds.</text>
