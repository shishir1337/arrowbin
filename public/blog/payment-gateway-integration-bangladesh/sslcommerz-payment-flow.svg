<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0e0b24"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#ff4da6"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="64" y="80" font-size="40" font-weight="700" fill="#0e0b24">How an SSLCommerz payment flows</text>
  <text x="64" y="118" font-size="24" fill="#4a4766">Hosted checkout. The order turns "paid" on validation, not on the redirect.</text>

  <!-- lanes -->
  <g font-size="20" font-weight="700" text-anchor="middle">
    <rect x="80" y="142" width="240" height="44" rx="22" fill="#cfc4ff"/>
    <text x="200" y="171" fill="#0e0b24">Shopper's browser</text>
    <rect x="520" y="142" width="240" height="44" rx="22" fill="#3b2bff"/>
    <text x="640" y="171" fill="#ffffff">Your server</text>
    <rect x="960" y="142" width="240" height="44" rx="22" fill="#ffd23f"/>
    <text x="1080" y="171" fill="#0e0b24">SSLCommerz</text>
  </g>
  <g stroke="#e4e4e7" stroke-width="3" stroke-dasharray="6 8">
    <line x1="200" y1="190" x2="200" y2="628"/>
    <line x1="640" y1="190" x2="640" y2="628"/>
    <line x1="1080" y1="190" x2="1080" y2="628"/>
  </g>

  <!-- arrows -->
  <g stroke="#0e0b24" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="200" y1="222" x2="634" y2="222"/>
    <line x1="640" y1="268" x2="1074" y2="268"/>
    <line x1="1080" y1="314" x2="646" y2="314"/>
    <line x1="200" y1="360" x2="1074" y2="360"/>
    <line x1="640" y1="452" x2="1074" y2="452"/>
    <line x1="1080" y1="498" x2="646" y2="498"/>
    <line x1="1080" y1="612" x2="206" y2="612"/>
  </g>
  <line x1="1080" y1="406" x2="646" y2="406" stroke="#ff4da6" stroke-width="3" marker-end="url(#p)"/>

  <!-- labels -->
  <g font-size="19" fill="#0e0b24" text-anchor="middle">
    <text x="420" y="212">1. Place order (saved as pending)</text>
    <text x="860" y="258">2. Create session: amount, tran_id, URLs</text>
    <text x="860" y="304">3. Gateway page URL</text>
    <rect x="452" y="331" width="376" height="24" fill="#ffffff"/>
    <text x="640" y="350">4. Shopper pays on hosted page or popup</text>
    <text x="860" y="396" font-weight="700" fill="#ff4da6">5. IPN to your server: status, val_id</text>
    <text x="860" y="442">6. Call Order Validation API (val_id)</text>
    <text x="860" y="488">7. VALID, amount, currency, risk_level</text>
    <rect x="436" y="583" width="408" height="24" fill="#ffffff"/>
    <text x="640" y="602">9. Back to success_url: page reads your DB</text>
  </g>

  <!-- step 8 note, on the server lifeline -->
  <rect x="430" y="518" width="420" height="48" rx="12" fill="#F1F2F7" stroke="#3b2bff" stroke-width="2"/>
  <text x="640" y="549" font-size="19" font-weight="700" fill="#3b2bff" text-anchor="middle">8. Amounts match? Mark paid, once.</text>

  <text x="64" y="684" font-size="18" fill="#4a4766">Source: SSLCommerz v4 developer documentation (developer.sslcommerz.com/doc/v4), checked 15 Oct 2026.</text>
</svg>
