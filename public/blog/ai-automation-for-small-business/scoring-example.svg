<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">Scoring three jobs at a 20-person trades firm</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">Volume × repetitiveness × error cost × data availability, each 1 to 5 (maximum 625)</text>

  <!-- column headers -->
  <text x="461" y="200" font-size="18" font-weight="600" fill="#4a4766" text-anchor="middle">Volume</text>
  <text x="547" y="200" font-size="18" font-weight="600" fill="#4a4766" text-anchor="middle">Repeat</text>
  <text x="633" y="200" font-size="18" font-weight="600" fill="#4a4766" text-anchor="middle">Error</text>
  <text x="719" y="200" font-size="18" font-weight="600" fill="#4a4766" text-anchor="middle">Data</text>
  <text x="820" y="200" font-size="18" font-weight="600" fill="#4a4766" text-anchor="middle">Score</text>

  <!-- zone strip for the bar column: 880..1200 = 320px for 625 -->
  <rect x="880" y="214" width="31" height="372" fill="#F1F2F7"/>
  <rect x="911" y="214" width="46" height="372" fill="#ffe1ef"/>
  <rect x="957" y="214" width="243" height="372" fill="#e6e1ff"/>
  <text x="880" y="200" font-size="18" fill="#4a4766">0</text>
  <text x="957" y="200" font-size="18" fill="#4a4766" text-anchor="middle">150</text>
  <text x="1200" y="200" font-size="18" fill="#4a4766" text-anchor="end">625</text>

  <!-- row 1: sorting customer emails 5 4 4 4 = 320 -->
  <text x="80" y="290" font-size="22" font-weight="700" fill="#0e0b24">Sorting customer emails</text>
  <rect x="431" y="252" width="60" height="60" rx="12" fill="#3b2bff"/>
  <text x="461" y="292" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="517" y="252" width="60" height="60" rx="12" fill="#cfc4ff"/>
  <text x="547" y="292" font-size="26" font-weight="700" fill="#0e0b24" text-anchor="middle">4</text>
  <rect x="603" y="252" width="60" height="60" rx="12" fill="#cfc4ff"/>
  <text x="633" y="292" font-size="26" font-weight="700" fill="#0e0b24" text-anchor="middle">4</text>
  <rect x="689" y="252" width="60" height="60" rx="12" fill="#cfc4ff"/>
  <text x="719" y="292" font-size="26" font-weight="700" fill="#0e0b24" text-anchor="middle">4</text>
  <text x="820" y="294" font-size="30" font-weight="700" fill="#0e0b24" text-anchor="middle">320</text>
  <rect x="880" y="262" width="164" height="40" rx="8" fill="#3b2bff"/>
  <text x="1056" y="290" font-size="20" font-weight="600" fill="#3b2bff">Start here</text>

  <!-- row 2: entering supplier invoices 3 5 3 5 = 225 -->
  <text x="80" y="412" font-size="22" font-weight="700" fill="#0e0b24">Entering supplier invoices</text>
  <rect x="431" y="374" width="60" height="60" rx="12" fill="#F1F2F7"/>
  <text x="461" y="414" font-size="26" font-weight="700" fill="#0e0b24" text-anchor="middle">3</text>
  <rect x="517" y="374" width="60" height="60" rx="12" fill="#3b2bff"/>
  <text x="547" y="414" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="603" y="374" width="60" height="60" rx="12" fill="#F1F2F7"/>
  <text x="633" y="414" font-size="26" font-weight="700" fill="#0e0b24" text-anchor="middle">3</text>
  <rect x="689" y="374" width="60" height="60" rx="12" fill="#3b2bff"/>
  <text x="719" y="414" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="820" y="416" font-size="30" font-weight="700" fill="#0e0b24" text-anchor="middle">225</text>
  <rect x="880" y="384" width="115" height="40" rx="8" fill="#3b2bff"/>
  <text x="1008" y="412" font-size="20" font-weight="600" fill="#3b2bff">Next, with approval</text>

  <!-- row 3: writing job quotes 3 2 1 2 = 12 -->
  <text x="80" y="534" font-size="22" font-weight="700" fill="#0e0b24">Writing job quotes</text>
  <rect x="431" y="496" width="60" height="60" rx="12" fill="#F1F2F7"/>
  <text x="461" y="536" font-size="26" font-weight="700" fill="#0e0b24" text-anchor="middle">3</text>
  <rect x="517" y="496" width="60" height="60" rx="12" fill="#ff6b3d"/>
  <text x="547" y="536" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="603" y="496" width="60" height="60" rx="12" fill="#ff6b3d"/>
  <text x="633" y="536" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="689" y="496" width="60" height="60" rx="12" fill="#ff6b3d"/>
  <text x="719" y="536" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="820" y="538" font-size="30" font-weight="700" fill="#0e0b24" text-anchor="middle">12</text>
  <rect x="880" y="506" width="6" height="40" rx="3" fill="#ff6b3d"/>
  <text x="900" y="534" font-size="20" font-weight="600" fill="#0e0b24">Keep with a person</text>

  <!-- legend for zones -->
  <rect x="80" y="612" width="22" height="22" rx="5" fill="#F1F2F7" stroke="#e4e4e7"/>
  <text x="112" y="630" font-size="18" fill="#4a4766">Under 60: leave it</text>
  <rect x="300" y="612" width="22" height="22" rx="5" fill="#ffe1ef"/>
  <text x="332" y="630" font-size="18" fill="#4a4766">60 to 150: later, or tighter checks</text>
  <rect x="640" y="612" width="22" height="22" rx="5" fill="#e6e1ff"/>
  <text x="672" y="630" font-size="18" fill="#4a4766">Over 150: good first candidate</text>
  <rect x="940" y="612" width="22" height="22" rx="5" fill="#ff6b3d"/>
  <text x="972" y="630" font-size="18" fill="#4a4766">Weak factor (1 or 2)</text>

  <text x="80" y="684" font-size="18" fill="#4a4766">Illustrative scores for a hypothetical business. Cut-offs are Arrowbin's rule of thumb, not a standard.</text>
</svg>
