      <path d="M81.5 479 l3 3 l5.5 -6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="104" y="484">extract_fields</text>
      <circle cx="86" cy="513" r="9" fill="#3b2bff"/>
      <path d="M81.5 513 l3 3 l5.5 -6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="104" y="518">match_supplier</text>
      <circle cx="86" cy="547" r="9" fill="#3b2bff"/>
      <path d="M81.5 547 l3 3 l5.5 -6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="104" y="552">cost_per_call</text>
    </g>
    <g font-size="12" font-weight="700" fill="#3b2bff">
      <rect x="338" y="469" width="50" height="22" rx="11" fill="#ece8ff"/>
      <text x="363" y="484" text-anchor="middle">pass</text>
      <rect x="338" y="503" width="50" height="22" rx="11" fill="#ece8ff"/>
      <text x="363" y="518" text-anchor="middle">pass</text>
      <rect x="338" y="537" width="50" height="22" rx="11" fill="#ece8ff"/>
      <text x="363" y="552" text-anchor="middle">pass</text>
    </g>
