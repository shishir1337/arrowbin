  <text x="295" y="244" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">personal data at launch?</text>
  <rect x="60" y="340" width="470" height="112" rx="18" fill="#F1F2F7" stroke="#cfc4ff" stroke-width="2"/>
  <text x="295" y="386" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">Is the hard part technical,</text>
  <text x="295" y="416" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">not whether people want it?</text>
