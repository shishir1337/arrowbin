<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfc4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfc4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4da6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff4da6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2bff"/>
      <stop offset="1" stop-color="#ff4da6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ff4da6"/>
    </marker>
    <symbol id="shirt" viewBox="0 0 120 120">
      <path d="M38 22 L50 14 Q60 22 70 14 L82 22 L104 40 L94 56 L84 48 L84 106 L36 106 L36 48 L26 56 L16 40 Z" fill="#ffffff"/>
      <path d="M50 14 Q60 26 70 14" fill="none" stroke="#e4e4e7" stroke-width="3"/>
    </symbol>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="#F1F2F7"/>
  <circle cx="1120" cy="90" r="320" fill="url(#glowA)"/>
  <circle cx="140" cy="660" r="300" fill="url(#glowB)"/>
  <circle cx="660" cy="720" r="260" fill="url(#glowC)"/>

  <!-- chat window -->
  <g filter="url(#shadow)">
    <rect x="60" y="80" width="560" height="580" rx="26" fill="#ffffff"/>
  </g>
  <circle cx="104" cy="124" r="20" fill="url(#avatar)"/>
  <path d="M104 112 l3.5 8.5 8.5 3.5 -8.5 3.5 -3.5 8.5 -3.5 -8.5 -8.5 -3.5 8.5 -3.5 Z" fill="#ffffff"/>
  <text x="136" y="131" font-size="20" font-weight="700" fill="#0e0b24">Shopping assistant</text>
  <circle cx="568" cy="124" r="4" fill="#4a4766"/>
  <circle cx="584" cy="124" r="4" fill="#4a4766"/>
  <circle cx="552" cy="124" r="4" fill="#4a4766"/>
  <line x1="60" y1="166" x2="620" y2="166" stroke="#e4e4e7" stroke-width="2"/>

  <!-- user message -->
  <rect x="236" y="186" width="360" height="48" rx="24" fill="#3b2bff"/>
  <text x="416" y="217" text-anchor="middle" font-size="18" fill="#ffffff">Linen shirt under $60, ships this week</text>

  <!-- assistant reply -->
  <circle cx="98" cy="268" r="14" fill="url(#avatar)"/>
  <rect x="124" y="256" width="300" height="12" rx="6" fill="#e4e4e7"/>
  <rect x="124" y="278" width="220" height="12" rx="6" fill="#e4e4e7"/>

