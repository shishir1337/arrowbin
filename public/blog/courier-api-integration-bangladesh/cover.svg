  <rect x="716" y="352" width="116" height="24" rx="12" fill="#f4f2ff"/>
  <path d="M726 364l4 4 8-8" fill="none" stroke="#3b2bff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
