    <line x1="56" y1="212" x2="408" y2="212" stroke="#e4e4e7" stroke-width="1.5"/>
    <rect x="142" y="209" width="150" height="3" fill="#3b2bff"/>

    <g font-size="13" font-family="Consolas, Menlo, monospace" fill="#a5a1bd">
