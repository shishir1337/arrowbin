<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="64" y="84" font-size="40" font-weight="700" fill="#0e0b24">First-year SSLCommerz cost at three store sizes</text>
  <text x="64" y="124" font-size="24" fill="#4a4766">Illustrative: Tk 2,000 average order, every order paid online at 2.5%</text>

  <!-- row labels -->
  <g font-size="22" font-weight="700" fill="#0e0b24">
    <text x="64" y="218">100 orders</text>
    <text x="64" y="358">400 orders</text>
    <text x="64" y="498">1,000 orders</text>
  </g>
  <g font-size="19" fill="#4a4766">
    <text x="64" y="246">a month (Tk 2 lakh)</text>
    <text x="64" y="386">a month (Tk 8 lakh)</text>
    <text x="64" y="526">a month (Tk 20 lakh)</text>
  </g>

  <!-- bars: Tk 625,500 = 760px -->
  <rect x="320" y="190" width="103.9" height="60" rx="8" fill="#3b2bff"/>
  <path d="M328 190h23v60h-23a8 8 0 0 1-8-8v-44a8 8 0 0 1 8-8z" fill="#ffd23f"/>
  <rect x="320" y="330" width="322.6" height="60" rx="8" fill="#3b2bff"/>
  <path d="M328 330h23v60h-23a8 8 0 0 1-8-8v-44a8 8 0 0 1 8-8z" fill="#ffd23f"/>
  <rect x="320" y="470" width="760" height="60" rx="8" fill="#3b2bff"/>
  <path d="M328 470h23v60h-23a8 8 0 0 1-8-8v-44a8 8 0 0 1 8-8z" fill="#ffd23f"/>

  <!-- totals -->
  <g font-size="22" font-weight="700" fill="#0e0b24">
    <text x="440" y="228">Tk 85,500</text>
    <text x="660" y="368">Tk 265,500</text>
    <text x="1094" y="508">Tk 625,500</text>
  </g>
  <g font-size="19" fill="#4a4766">
    <text x="320" y="282">Plan fee is about 30% of year one</text>
    <text x="320" y="422">Plan fee is about 10% of year one</text>
    <text x="320" y="562">Plan fee is about 4% of year one</text>
  </g>

  <!-- legend -->
  <rect x="64" y="600" width="24" height="24" rx="6" fill="#ffd23f"/>
  <text x="100" y="619" font-size="19" fill="#0e0b24">Basic plan, Tk 25,500 (non-refundable)</text>
  <rect x="520" y="600" width="24" height="24" rx="6" fill="#3b2bff"/>
  <text x="556" y="619" font-size="19" fill="#0e0b24">2.5% of each successful payment</text>

  <text x="64" y="680" font-size="18" fill="#4a4766">Source: SSLCommerz pricing page, as listed on 15 Oct 2026. Volumes are hypothetical; excludes AMEX (3.5%).</text>
</svg>
