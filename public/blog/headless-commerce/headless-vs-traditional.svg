<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b2bff"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="80" font-size="40" font-weight="700" fill="#0e0b24">Traditional store vs headless commerce</text>
  <text x="80" y="118" font-size="24" fill="#4a4766">Headless splits the website from the commerce engine; the two talk through an API</text>

  <!-- left panel: traditional -->
  <rect x="80" y="160" width="500" height="490" rx="20" fill="#F1F2F7"/>
  <text x="110" y="205" font-size="26" font-weight="700" fill="#0e0b24">Traditional store</text>
  <text x="110" y="236" font-size="20" fill="#4a4766">Theme and engine live in one platform</text>

  <rect x="110" y="262" width="440" height="296" rx="18" fill="#ffffff" stroke="#cfc4ff" stroke-width="3"/>
  <text x="134" y="294" font-size="18" font-weight="600" fill="#4a4766">ONE PLATFORM</text>
  <rect x="134" y="310" width="392" height="106" rx="12" fill="#3b2bff"/>
  <text x="160" y="354" font-size="24" font-weight="700" fill="#ffffff">Theme</text>
  <text x="160" y="388" font-size="20" fill="#ffffff">Pages, layout, design</text>
  <rect x="134" y="428" width="392" height="106" rx="12" fill="#cfc4ff"/>
  <text x="160" y="472" font-size="24" font-weight="700" fill="#0e0b24">Commerce engine</text>
  <text x="160" y="506" font-size="20" fill="#0e0b24">Catalog, checkout, orders</text>

  <text x="110" y="610" font-size="20" fill="#4a4766">Quick to change, but only within</text>
  <text x="110" y="636" font-size="20" fill="#4a4766">what the theme system allows</text>

  <!-- right panel: headless -->
  <rect x="620" y="160" width="580" height="490" rx="20" fill="#F1F2F7"/>
  <text x="650" y="205" font-size="26" font-weight="700" fill="#0e0b24">Headless commerce</text>
  <text x="650" y="236" font-size="20" fill="#4a4766">Separate front ends call one back end</text>

  <g>
    <rect x="650" y="262" width="160" height="92" rx="14" fill="#ffffff" stroke="#3b2bff" stroke-width="3"/>
    <text x="730" y="301" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">Website</text>
    <text x="730" y="330" font-size="18" fill="#4a4766" text-anchor="middle">e.g. Next.js</text>

    <rect x="830" y="262" width="160" height="92" rx="14" fill="#ffffff" stroke="#3b2bff" stroke-width="3"/>
    <text x="910" y="301" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">Mobile app</text>
    <text x="910" y="330" font-size="18" fill="#4a4766" text-anchor="middle">iOS, Android</text>

    <rect x="1010" y="262" width="160" height="92" rx="14" fill="#ffffff" stroke="#ff4da6" stroke-width="3"/>
    <text x="1090" y="301" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">AI assistant</text>
    <text x="1090" y="330" font-size="18" fill="#4a4766" text-anchor="middle">via feeds, HTML</text>
  </g>

  <g stroke="#3b2bff" stroke-width="3" fill="none">
    <line x1="730" y1="356" x2="730" y2="392" marker-end="url(#arr)"/>
    <line x1="910" y1="356" x2="910" y2="392" marker-end="url(#arr)"/>
    <line x1="1090" y1="356" x2="1090" y2="392" marker-end="url(#arr)"/>
    <line x1="910" y1="452" x2="910" y2="484" marker-end="url(#arr)"/>
  </g>

  <rect x="650" y="398" width="520" height="52" rx="26" fill="#ffd23f"/>
  <text x="910" y="431" font-size="20" font-weight="700" fill="#0e0b24" text-anchor="middle">API (e.g. Shopify Storefront API)</text>

  <rect x="650" y="488" width="520" height="92" rx="14" fill="#cfc4ff"/>
  <text x="676" y="524" font-size="24" font-weight="700" fill="#0e0b24">Commerce back end</text>
  <text x="676" y="558" font-size="20" fill="#0e0b24">Catalog, stock, checkout, orders, admin</text>

  <text x="650" y="610" font-size="20" fill="#4a4766">Your team keeps the same admin, and</text>
  <text x="650" y="636" font-size="20" fill="#4a4766">checkout stays on the platform</text>
</svg>
