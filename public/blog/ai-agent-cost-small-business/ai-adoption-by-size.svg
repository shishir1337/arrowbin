<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">AI use by business size</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">Share of businesses using AI, from two different national surveys</text>
  <line x1="640" y1="170" x2="640" y2="640" stroke="#e4e4e7" stroke-width="2"/>
  <text x="80" y="190" font-size="26" font-weight="700" fill="#0e0b24">United States</text>
  <text x="80" y="218" font-size="18" fill="#4a4766">Census Bureau, Dec 2025 to May 2026</text>
  <text x="80" y="246" font-size="18" fill="#0e0b24">All businesses: 17% to 20%</text>
  <line x1="80" y1="580" x2="600" y2="580" stroke="#e4e4e7" stroke-width="3"/>
  <rect x="111.7" y="480" width="110" height="100" rx="6" fill="#cfc4ff" fill-opacity="0.55" stroke="#3b2bff" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="166.7" y="468" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">under 20%</text>
  <text x="166.7" y="610" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">1–4</text>
  <rect x="285" y="420" width="110" height="160" rx="6" fill="#3b2bff"/>
  <text x="340" y="408" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">32%</text>
  <text x="340" y="610" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">100–249</text>
  <rect x="458.3" y="395" width="110" height="185" rx="6" fill="#3b2bff"/>
  <text x="513.3" y="383" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">37%</text>
  <text x="513.3" y="610" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">250+</text>
  <text x="340" y="638" font-size="18" fill="#4a4766" text-anchor="middle">employees</text>
  <text x="680" y="190" font-size="26" font-weight="700" fill="#0e0b24">United Kingdom</text>
  <text x="680" y="218" font-size="18" fill="#4a4766">ONS, Wave 159, June 2026</text>
  <text x="680" y="246" font-size="18" fill="#0e0b24">10+ employees in late 2023: around 12%</text>
  <line x1="680" y1="580" x2="1200" y2="580" stroke="#e4e4e7" stroke-width="3"/>
  <rect x="711.7" y="440" width="110" height="140" rx="6" fill="#ff4da6"/>
  <text x="766.7" y="428" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">28%</text>
  <text x="766.7" y="610" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">0–9</text>
  <rect x="885" y="405" width="110" height="175" rx="6" fill="#ff4da6"/>
  <text x="940" y="393" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">around 35%</text>
  <text x="940" y="610" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">10+</text>
  <rect x="1058.3" y="335" width="110" height="245" rx="6" fill="#ff4da6"/>
  <text x="1113.3" y="323" font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">49%</text>
  <text x="1113.3" y="610" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">250+</text>
  <text x="940" y="638" font-size="18" fill="#4a4766" text-anchor="middle">employees</text>
  <text x="80" y="684" font-size="18" fill="#4a4766">Different surveys and questions: compare within a country, not across.</text>
</svg>
