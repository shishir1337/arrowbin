<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a4766"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">Three ways to run the site after the move</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">Where editors work, and what a visitor's request actually reaches</text>

  <!-- column headers -->
  <g font-size="24" font-weight="700" fill="#0e0b24" text-anchor="middle">
    <text x="253" y="188">Classic WordPress</text>
    <text x="640" y="188">Headless WordPress</text>
    <text x="1027" y="188">Next.js + other CMS</text>
  </g>
  <g font-size="18" fill="#4a4766" text-anchor="middle">
    <text x="253" y="214">One system does everything</text>
    <text x="640" y="214">WordPress edits, Next.js serves</text>
    <text x="1027" y="214">No WordPress left to run</text>
  </g>

  <!-- arrows -->
  <g stroke="#4a4766" stroke-width="2.5" marker-end="url(#a)">
    <line x1="253" y1="294" x2="253" y2="314"/>
    <line x1="253" y1="372" x2="253" y2="392"/>
    <line x1="253" y1="450" x2="253" y2="548"/>
    <line x1="640" y1="294" x2="640" y2="314"/>
    <line x1="640" y1="372" x2="640" y2="392"/>
    <line x1="640" y1="450" x2="640" y2="470"/>
    <line x1="640" y1="528" x2="640" y2="548"/>
    <line x1="1027" y1="294" x2="1027" y2="314"/>
    <line x1="1027" y1="372" x2="1027" y2="392"/>
    <line x1="1027" y1="450" x2="1027" y2="548"/>
  </g>

  <!-- column 1: classic -->
  <rect x="80" y="240" width="346" height="54" rx="12" fill="#F1F2F7"/>
  <rect x="80" y="318" width="346" height="54" rx="12" fill="#cfc4ff"/>
  <rect x="80" y="396" width="346" height="54" rx="12" fill="#cfc4ff"/>
  <!-- column 2: headless -->
  <rect x="467" y="240" width="346" height="54" rx="12" fill="#F1F2F7"/>
  <rect x="467" y="318" width="346" height="54" rx="12" fill="#cfc4ff"/>
  <rect x="467" y="396" width="346" height="54" rx="12" fill="#3b2bff"/>
  <rect x="467" y="474" width="346" height="54" rx="12" fill="#ffd23f"/>
  <!-- column 3: other CMS -->
  <rect x="854" y="240" width="346" height="54" rx="12" fill="#F1F2F7"/>
  <rect x="854" y="318" width="346" height="54" rx="12" fill="#3b2bff"/>
  <rect x="854" y="396" width="346" height="54" rx="12" fill="#ffd23f"/>
  <!-- visitors -->
  <g fill="#ffffff" stroke="#0e0b24" stroke-width="2.5">
    <rect x="80" y="552" width="346" height="54" rx="12"/>
    <rect x="467" y="552" width="346" height="54" rx="12"/>
    <rect x="854" y="552" width="346" height="54" rx="12"/>
  </g>

  <g font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">
    <text x="253" y="274">Editors in the WP admin</text>
    <text x="253" y="352">Theme + plugins in PHP</text>
    <text x="253" y="430">Page built on the server</text>
    <text x="640" y="274">Editors in the WP admin</text>
    <text x="640" y="352">REST API or WPGraphQL</text>
    <text x="640" y="508">CDN</text>
    <text x="1027" y="274">Hosted CMS or Markdown</text>
    <text x="1027" y="430">CDN</text>
    <text x="253" y="586">Visitor</text>
    <text x="640" y="586">Visitor</text>
    <text x="1027" y="586">Visitor</text>
  </g>
  <g font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">
    <text x="640" y="430">Next.js pre-renders pages</text>
    <text x="1027" y="352">Next.js pre-renders pages</text>
  </g>

  <!-- what is public -->
  <g font-size="18" fill="#4a4766" text-anchor="middle">
    <text x="253" y="648">Public: login page and every plugin</text>
    <text x="640" y="648">Admin can live on a private subdomain</text>
    <text x="1027" y="648">No WordPress to patch</text>
  </g>

  <!-- legend -->
  <g font-size="18" fill="#4a4766">
    <rect x="80" y="676" width="18" height="18" rx="4" fill="#cfc4ff"/>
    <text x="106" y="691">WordPress</text>
    <rect x="220" y="676" width="18" height="18" rx="4" fill="#3b2bff"/>
    <text x="246" y="691">Next.js</text>
    <rect x="340" y="676" width="18" height="18" rx="4" fill="#ffd23f"/>
    <text x="366" y="691">Edge cache</text>
  </g>
</svg>
