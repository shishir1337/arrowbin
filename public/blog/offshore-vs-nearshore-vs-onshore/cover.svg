<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="gLilac" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfc4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfc4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gPlasma" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4da6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4da6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2bff"/>
      <stop offset="1" stop-color="#ff4da6"/>
    </linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4da6"/>
      <stop offset="1" stop-color="#ff6b3d"/>
    </linearGradient>
    <clipPath id="c1"><rect x="120" y="210" width="332" height="168" rx="14"/></clipPath>
    <clipPath id="c2"><rect x="468" y="210" width="332" height="168" rx="14"/></clipPath>
    <clipPath id="c3"><rect x="120" y="394" width="332" height="168" rx="14"/></clipPath>
    <clipPath id="c4"><rect x="468" y="394" width="332" height="168" rx="14"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="#F1F2F7"/>
  <circle cx="150" cy="650" r="320" fill="url(#gLilac)"/>
  <circle cx="1180" cy="70" r="260" fill="url(#gPlasma)"/>
  <circle cx="620" cy="30" r="150" fill="url(#gSun)"/>

  <!-- app window -->
  <rect x="100" y="86" width="1100" height="590" rx="20" fill="#0e0b24" opacity="0.12" filter="url(#shadow)"/>
  <rect x="90" y="66" width="1100" height="590" rx="20" fill="#ffffff"/>
  <path d="M90 86 a20 20 0 0 1 20 -20 h1060 a20 20 0 0 1 20 20 v26 h-1100 z" fill="#F1F2F7"/>
  <line x1="90" y1="112" x2="1190" y2="112" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="116" cy="89" r="6" fill="#ff6b3d"/>
  <circle cx="138" cy="89" r="6" fill="#ffd23f"/>
  <circle cx="160" cy="89" r="6" fill="#cfc4ff"/>
  <rect x="540" y="76" width="200" height="26" rx="13" fill="#ffffff"/>
  <text x="640" y="95" font-size="16" font-weight="600" fill="#4a4766" text-anchor="middle">Weekly demo</text>
  <rect x="1094" y="76" width="74" height="26" rx="13" fill="#ffffff"/>
  <circle cx="1112" cy="89" r="5" fill="#ff4da6"/>
  <text x="1144" y="95" font-size="15" font-weight="700" fill="#0e0b24" text-anchor="middle">LIVE</text>

  <!-- world clocks -->
  <g>
    <rect x="120" y="130" width="236" height="60" rx="14" fill="#F1F2F7"/>
    <rect x="370" y="130" width="236" height="60" rx="14" fill="#F1F2F7"/>
    <rect x="620" y="130" width="236" height="60" rx="14" fill="#F1F2F7"/>
    <rect x="870" y="130" width="290" height="60" rx="14" fill="#F1F2F7"/>
  </g>
  <!-- day icons -->
  <g fill="#ffd23f">
    <circle cx="150" cy="160" r="11"/>
    <circle cx="400" cy="160" r="11"/>
    <circle cx="650" cy="160" r="11"/>
  </g>
  <path d="M906 150 a12 12 0 1 0 8 20 a10 10 0 0 1 -8 -20 z" fill="#3b2bff"/>
  <g font-size="16" fill="#4a4766">
    <text x="172" y="154">New York</text>
    <text x="422" y="154">São Paulo</text>
    <text x="672" y="154">Lisbon</text>
    <text x="926" y="154">Bengaluru</text>
  </g>
  <g font-size="20" font-weight="700" fill="#0e0b24">
    <text x="172" y="179">10:00 AM</text>
    <text x="422" y="179">11:00 AM</text>
    <text x="672" y="179">3:00 PM</text>
    <text x="926" y="179">7:30 PM</text>
  </g>
  <rect x="1060" y="146" width="84" height="28" rx="14" fill="#cfc4ff"/>
  <text x="1102" y="166" font-size="15" font-weight="700" fill="#0e0b24" text-anchor="middle">Evening</text>

  <!-- video tiles -->
  <rect x="120" y="210" width="332" height="168" rx="14" fill="url(#t1)"/>
  <rect x="468" y="210" width="332" height="168" rx="14" fill="#cfc4ff"/>
  <rect x="120" y="394" width="332" height="168" rx="14" fill="url(#t3)"/>
  <rect x="468" y="394" width="332" height="168" rx="14" fill="#ffd23f"/>

  <g fill="#ffffff" opacity="0.9">
    <g clip-path="url(#c1)">
      <circle cx="302" cy="276" r="30"/>
      <path d="M242 382 a60 50 0 0 1 120 0 z"/>
    </g>
    <g clip-path="url(#c2)">
      <circle cx="650" cy="276" r="30"/>
      <path d="M590 382 a60 50 0 0 1 120 0 z"/>
    </g>
    <g clip-path="url(#c3)">
      <circle cx="302" cy="460" r="30"/>
      <path d="M242 566 a60 50 0 0 1 120 0 z"/>
    </g>
    <g clip-path="url(#c4)">
      <circle cx="650" cy="460" r="30"/>
      <path d="M590 566 a60 50 0 0 1 120 0 z"/>
    </g>
  </g>
  <!-- active speaker -->
  <rect x="470" y="212" width="328" height="164" rx="13" fill="none" stroke="#3b2bff" stroke-width="4"/>
  <g fill="#ffffff">
    <rect x="132" y="338" width="104" height="28" rx="14"/>
    <rect x="480" y="338" width="112" height="28" rx="14"/>
    <rect x="132" y="522" width="84" height="28" rx="14"/>
    <rect x="480" y="522" width="112" height="28" rx="14"/>
  </g>
  <g font-size="16" font-weight="600" fill="#0e0b24">
    <text x="146" y="358">New York</text>
    <text x="494" y="358">São Paulo</text>
    <text x="146" y="542">Lisbon</text>
    <text x="494" y="542">Bengaluru</text>
  </g>
  <!-- speaking bars -->
  <g fill="#3b2bff">
    <rect x="760" y="346" width="5" height="12" rx="2.5"/>
    <rect x="769" y="340" width="5" height="18" rx="2.5"/>
    <rect x="778" y="344" width="5" height="14" rx="2.5"/>
  </g>

  <!-- side panel: shared hours -->
  <rect x="830" y="210" width="330" height="352" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="852" y="246" font-size="19" font-weight="700" fill="#0e0b24">Shared hours</text>
  <text x="852" y="270" font-size="16" fill="#4a4766">with New York, today</text>

  <g font-size="16" fill="#0e0b24">
    <text x="852" y="308">Your day</text>
    <text x="852" y="362">São Paulo</text>
    <text x="852" y="416">Lisbon</text>
    <text x="852" y="470">Bengaluru</text>
  </g>
  <g font-size="16" font-weight="700" text-anchor="end">
    <text x="1138" y="362" fill="#3b2bff">7 h</text>
    <text x="1138" y="416" fill="#3b2bff">3 h</text>
    <text x="1138" y="470" fill="#4a4766">0 h</text>
  </g>
  <!-- 24h tracks: x = 852 + 11.9 * hour (New York time) -->
  <g fill="#F1F2F7">
    <rect x="852" y="318" width="286" height="12" rx="6"/>
    <rect x="852" y="372" width="286" height="12" rx="6"/>
    <rect x="852" y="426" width="286" height="12" rx="6"/>
    <rect x="852" y="480" width="286" height="12" rx="6"/>
  </g>
  <rect x="959" y="318" width="95" height="12" rx="6" fill="#ffd23f"/>
  <rect x="947" y="372" width="95" height="12" rx="6" fill="#cfc4ff"/>
  <rect x="959" y="372" width="83" height="12" rx="6" fill="#3b2bff"/>
  <rect x="900" y="426" width="95" height="12" rx="6" fill="#cfc4ff"/>
  <rect x="959" y="426" width="36" height="12" rx="6" fill="#3b2bff"/>
  <rect x="852" y="480" width="89" height="12" rx="6" fill="#cfc4ff"/>
  <rect x="1132" y="480" width="6" height="12" rx="3" fill="#cfc4ff"/>
  <line x1="959" y1="304" x2="959" y2="498" stroke="#3b2bff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="1054" y1="304" x2="1054" y2="498" stroke="#3b2bff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>

  <rect x="852" y="512" width="286" height="34" rx="17" fill="#3b2bff"/>
  <text x="995" y="535" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Set overlap hours</text>

  <!-- call controls -->
  <g fill="#F1F2F7">
    <circle cx="530" cy="610" r="22"/>
    <circle cx="586" cy="610" r="22"/>
    <circle cx="642" cy="610" r="22"/>
    <circle cx="698" cy="610" r="22"/>
  </g>
  <!-- mic -->
  <rect x="525" y="598" width="10" height="16" rx="5" fill="#0e0b24"/>
  <path d="M520 609 a10 10 0 0 0 20 0 M530 619 v5" fill="none" stroke="#0e0b24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- camera -->
  <rect x="574" y="602" width="18" height="16" rx="3" fill="#0e0b24"/>
  <path d="M592 606 l8 -4 v16 l-8 -4 z" fill="#0e0b24"/>
  <!-- screen share -->
  <rect x="630" y="600" width="24" height="17" rx="3" fill="none" stroke="#0e0b24" stroke-width="2.5"/>
  <path d="M642 613 v-8 M638 609 l4 -4 l4 4" fill="none" stroke="#0e0b24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chat -->
  <path d="M688 601 h20 a3 3 0 0 1 3 3 v10 a3 3 0 0 1 -3 3 h-12 l-6 5 v-5 h-2 a3 3 0 0 1 -3 -3 v-10 a3 3 0 0 1 3 -3 z" fill="#0e0b24"/>
  <rect x="740" y="590" width="96" height="40" rx="20" fill="#ff6b3d"/>
  <text x="788" y="616" font-size="16" font-weight="700" fill="#0e0b24" text-anchor="middle">Leave</text>
</svg>
