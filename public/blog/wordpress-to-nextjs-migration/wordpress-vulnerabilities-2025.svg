<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="bar"><rect x="80" y="196" width="1120" height="96" rx="16"/></clipPath>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">Where WordPress security holes came from in 2025</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">11,334 new vulnerabilities in the WordPress ecosystem, 42% more than in 2024</text>

  <!-- stacked bar: plugins 91%, themes 9% -->
  <g clip-path="url(#bar)">
    <rect x="80" y="196" width="1019" height="96" fill="#3b2bff"/>
    <rect x="1099" y="196" width="101" height="96" fill="#ff6b3d"/>
  </g>
  <text x="112" y="256" font-size="32" font-weight="700" fill="#ffffff">Plugins: 91%</text>
  <text x="1149" y="256" font-size="28" font-weight="700" fill="#0e0b24" text-anchor="middle">9%</text>
  <text x="80" y="330" font-size="20" fill="#4a4766">Share of new vulnerabilities by where they were found</text>
  <text x="1200" y="330" font-size="20" fill="#4a4766" text-anchor="end">Themes</text>

  <!-- stat cards -->
  <g fill="#F1F2F7">
    <rect x="80" y="380" width="352" height="210" rx="18"/>
    <rect x="464" y="380" width="352" height="210" rx="18"/>
    <rect x="848" y="380" width="352" height="210" rx="18"/>
  </g>
  <g font-size="60" font-weight="700">
    <text x="108" y="466" fill="#3b2bff">46%</text>
    <text x="492" y="466" fill="#ff4da6">5 hours</text>
    <text x="876" y="466" fill="#0e0b24">6</text>
  </g>
  <g font-size="21" fill="#0e0b24">
    <text x="108" y="518">had no developer fix by</text>
    <text x="108" y="548">the time of public disclosure</text>
    <text x="492" y="518">weighted median time</text>
    <text x="492" y="548">to first exploit</text>
    <text x="876" y="518">reported in WordPress core</text>
    <text x="876" y="548">itself, all low priority</text>
  </g>

  <text x="80" y="672" font-size="18" fill="#4a4766">Source: Patchstack, State of WordPress Security in 2026 (updated 25 Feb 2026)</text>
</svg>
