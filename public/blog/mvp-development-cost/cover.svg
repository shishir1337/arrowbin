    <line x1="822" y1="422" x2="1178" y2="422" stroke="#f1f2f7" stroke-width="1.5"/>
    <circle cx="830" cy="442" r="7" fill="#3b2bff"/>
    <text x="848" y="448" fill="#0e0b24">Development</text>
