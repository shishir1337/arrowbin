  <text x="222" y="104" font-size="16" fill="#4a4766">admin.yourstore.com.bd/orders/1047</text>

  <!-- header -->
  <text x="100" y="180" font-size="30" font-weight="700" fill="#0e0b24">Order #1047</text>
  <rect x="292" y="156" width="112" height="30" rx="15" fill="#cfc4ff"/>
  <text x="348" y="177" font-size="15" font-weight="700" fill="#0e0b24" text-anchor="middle">Confirmed</text>
  <rect x="414" y="156" width="70" height="30" rx="15" fill="#fff6d6"/>
  <text x="449" y="177" font-size="15" font-weight="700" fill="#0e0b24" text-anchor="middle">COD</text>

