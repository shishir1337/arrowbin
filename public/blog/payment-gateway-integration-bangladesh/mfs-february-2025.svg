<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="64" y="84" font-size="40" font-weight="700" fill="#0e0b24">Mobile money in Bangladesh, February 2025</text>
  <text x="64" y="124" font-size="24" fill="#4a4766">Transaction value by type, Tk crore (month total: 164,726.30)</text>

  <!-- stat cards -->
  <rect x="64" y="166" width="330" height="150" rx="18" fill="#F1F2F7"/>
  <text x="92" y="226" font-size="44" font-weight="700" fill="#3b2bff">2,392.40</text>
  <text x="92" y="262" font-size="20" font-weight="600" fill="#0e0b24">lakh registered accounts</text>
  <text x="92" y="292" font-size="20" fill="#4a4766">about 239 million</text>

  <rect x="64" y="332" width="330" height="150" rx="18" fill="#F1F2F7"/>
  <text x="92" y="392" font-size="44" font-weight="700" fill="#3b2bff">871.54</text>
  <text x="92" y="428" font-size="20" font-weight="600" fill="#0e0b24">lakh active accounts</text>
  <text x="92" y="458" font-size="20" fill="#4a4766">used in the last 3 months</text>

  <rect x="64" y="498" width="330" height="126" rx="18" fill="#F1F2F7"/>
  <text x="92" y="554" font-size="40" font-weight="700" fill="#3b2bff">1,856,190</text>
  <text x="92" y="592" font-size="20" font-weight="600" fill="#0e0b24">agents</text>

  <!-- bar labels -->
  <g font-size="20" fill="#0e0b24" text-anchor="end">
    <text x="690" y="212">Cash out</text>
    <text x="690" y="276">Cash in</text>
    <text x="690" y="340">Person to person</text>
    <text x="690" y="404">All other types</text>
    <text x="690" y="468" font-weight="700" fill="#ff4da6">Merchant payment</text>
    <text x="690" y="532">Salary payments</text>
    <text x="690" y="596">Utility bills</text>
  </g>

  <!-- bars (scale: 51,213.30 = 394px) -->
  <g>
    <rect x="706" y="186" width="394" height="38" rx="8" fill="#cfc4ff"/>
    <rect x="706" y="250" width="351.8" height="38" rx="8" fill="#cfc4ff"/>
    <rect x="706" y="314" width="321.4" height="38" rx="8" fill="#cfc4ff"/>
    <rect x="706" y="378" width="90.3" height="38" rx="8" fill="#cfc4ff"/>
    <rect x="706" y="442" width="53.3" height="38" rx="8" fill="#ff4da6"/>
    <rect x="706" y="506" width="39" height="38" rx="8" fill="#cfc4ff"/>
    <rect x="706" y="570" width="17.4" height="38" rx="6" fill="#cfc4ff"/>
  </g>

  <!-- values -->
  <g font-size="20" font-weight="600" fill="#0e0b24">
    <text x="1112" y="212">51,213.30</text>
    <text x="1070" y="276">45,726.32</text>
    <text x="1040" y="340">41,778.91</text>
    <text x="808" y="404">11,741.38</text>
    <text x="771" y="468">6,922.67</text>
    <text x="757" y="532">5,075.83</text>
    <text x="735" y="596">2,267.89</text>
  </g>
  <text x="872" y="468" font-size="20" fill="#4a4766">about 4% of the month's value</text>

  <line x1="64" y1="648" x2="1216" y2="648" stroke="#e4e4e7" stroke-width="2"/>
  <text x="64" y="684" font-size="18" fill="#4a4766">Source: Bangladesh Bank MFS data, latest month published (Feb 2025). Counts are accounts, not unique people.</text>
</svg>
