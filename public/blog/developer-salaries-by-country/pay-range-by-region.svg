  <text x="64" y="518" font-size="22" fill="#4a4766">$32k–$56k</text>
  <line x1="400" y1="496" x2="1200" y2="496" stroke="#e4e4e7" stroke-width="4" stroke-linecap="round"/>
  <rect x="558.8" y="484" width="123.4" height="24" rx="12" fill="#3b2bff"/>
  <text x="64" y="552" font-size="26" font-weight="700" fill="#0e0b24">Latin America</text>
  <text x="64" y="580" font-size="22" fill="#4a4766">$33k–$41k</text>
  <line x1="400" y1="558" x2="1200" y2="558" stroke="#e4e4e7" stroke-width="4" stroke-linecap="round"/>
  <rect x="563.8" y="546" width="42.9" height="24" rx="12" fill="#3b2bff"/>
  <text x="64" y="614" font-size="26" font-weight="700" fill="#0e0b24">South Asia</text>
  <text x="64" y="642" font-size="22" fill="#4a4766">$9.9k–$19.8k</text>
  <line x1="400" y1="620" x2="1200" y2="620" stroke="#e4e4e7" stroke-width="4" stroke-linecap="round"/>
  <rect x="449.7" y="608" width="49.1" height="24" rx="12" fill="#ff4da6"/>
