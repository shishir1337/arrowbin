<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">A pilot that limits the downside</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">One workflow, read-only first, widened only when the numbers hold</text>
  <line x1="160" y1="268" x2="1120" y2="268" stroke="#e4e4e7" stroke-width="6"/>
  <circle cx="160" cy="268" r="44" fill="#3b2bff"/>
  <text x="160" y="281" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="160" y="350" font-size="21" font-weight="600" fill="#0e0b24" text-anchor="middle">Pick one job</text>
  <text x="160" y="376" font-size="21" font-weight="600" fill="#0e0b24" text-anchor="middle">with a clear answer</text>
  <circle cx="400" cy="268" r="44" fill="#ff6b3d"/>
  <text x="400" y="281" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="400" y="350" font-size="21" font-weight="600" fill="#0e0b24" text-anchor="middle">Write 50–100</text>
  <text x="400" y="376" font-size="21" font-weight="600" fill="#0e0b24" text-anchor="middle">real test cases</text>
  <circle cx="640" cy="268" r="44" fill="#ff4da6"/>
  <text x="640" y="281" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="640" y="350" font-size="21" font-weight="600" fill="#0e0b24" text-anchor="middle">Read-only</text>
  <text x="640" y="376" font-size="21" font-weight="600" fill="#0e0b24" text-anchor="middle">prototype</text>
  <rect x="579" y="396" width="122" height="36" rx="18" fill="#F1F2F7"/>
  <text x="640" y="420" font-size="18" fill="#4a4766" text-anchor="middle">2–3 weeks</text>
  <circle cx="880" cy="268" r="44" fill="#cfc4ff"/>
  <text x="880" y="281" font-size="36" font-weight="700" fill="#0e0b24" text-anchor="middle">4</text>
  <text x="880" y="350" font-size="21" font-weight="600" fill="#0e0b24" text-anchor="middle">Run a month</text>
  <text x="880" y="376" font-size="21" font-weight="600" fill="#0e0b24" text-anchor="middle">and measure</text>
  <rect x="799" y="396" width="162" height="36" rx="18" fill="#F1F2F7"/>
  <text x="880" y="420" font-size="18" fill="#4a4766" text-anchor="middle">About a month</text>
  <circle cx="1120" cy="268" r="44" fill="#ffd23f"/>
  <text x="1120" y="281" font-size="36" font-weight="700" fill="#0e0b24" text-anchor="middle">5</text>
  <text x="1120" y="350" font-size="21" font-weight="600" fill="#0e0b24" text-anchor="middle">Widen in</text>
  <text x="1120" y="376" font-size="21" font-weight="600" fill="#0e0b24" text-anchor="middle">small steps</text>
  <rect x="1054" y="396" width="132" height="36" rx="18" fill="#F1F2F7"/>
  <text x="1120" y="420" font-size="18" fill="#4a4766" text-anchor="middle">+3–6 weeks</text>
  <rect x="80" y="478" width="432" height="76" rx="14" fill="#F1F2F7"/>
  <text x="296" y="523" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">Before any build: no model fees yet</text>
  <rect x="524" y="478" width="464" height="76" rx="14" fill="#cfc4ff"/>
  <text x="756" y="523" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">A person approves everything it sends</text>
  <rect x="1000" y="478" width="200" height="76" rx="14" fill="#ffd23f"/>
  <text x="1100" y="510" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">Acts alone on</text>
  <text x="1100" y="536" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">low-risk items</text>
  <text x="80" y="624" font-size="18" fill="#4a4766">Durations from Arrowbin's AI automation service page: working prototype on real data in 2–3 weeks,</text>
  <text x="80" y="650" font-size="18" fill="#4a4766">then another 3–6 weeks to take it into production with integrations, security and monitoring.</text>
</svg>
