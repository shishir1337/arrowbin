<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">A sensible maintenance calendar</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">What a good plan does for a live product, and how often</text>

  <!-- rows -->
  <g fill="#F1F2F7">
    <rect x="80" y="166" width="1120" height="64" rx="16"/>
    <rect x="80" y="242" width="1120" height="64" rx="16"/>
    <rect x="80" y="318" width="1120" height="64" rx="16"/>
    <rect x="80" y="394" width="1120" height="64" rx="16"/>
    <rect x="80" y="470" width="1120" height="64" rx="16"/>
    <rect x="80" y="546" width="1120" height="64" rx="16"/>
  </g>

  <!-- frequency pills -->
  <rect x="96" y="178" width="184" height="40" rx="20" fill="#3b2bff"/>
  <rect x="96" y="254" width="184" height="40" rx="20" fill="#ff4da6"/>
  <rect x="96" y="330" width="184" height="40" rx="20" fill="#ff6b3d"/>
  <rect x="96" y="406" width="184" height="40" rx="20" fill="#ffd23f"/>
  <rect x="96" y="482" width="184" height="40" rx="20" fill="#cfc4ff"/>
  <rect x="96" y="558" width="184" height="40" rx="20" fill="#0e0b24"/>
  <g font-size="20" font-weight="700" text-anchor="middle">
    <text x="188" y="205" fill="#ffffff">All the time</text>
    <text x="188" y="281" fill="#0e0b24">Daily</text>
    <text x="188" y="357" fill="#0e0b24">Weekly</text>
    <text x="188" y="433" fill="#0e0b24">Monthly</text>
    <text x="188" y="509" fill="#0e0b24">Quarterly</text>
    <text x="188" y="585" fill="#ffffff">Yearly</text>
  </g>

  <!-- tasks -->
  <g font-size="22" fill="#0e0b24">
    <text x="308" y="206">Uptime and error monitoring, with alerts that reach a named person</text>
    <text x="308" y="282">Automated backups of the database and uploaded files</text>
    <text x="308" y="358">Review security advisories and pending updates; triage new bugs</text>
    <text x="308" y="434">Apply minor updates and send the health report</text>
    <text x="308" y="510">Restore a backup on purpose; review who has access</text>
    <text x="308" y="586">Plan major version upgrades; check platform deadlines; review the budget</text>
  </g>

  <text x="80" y="672" font-size="18" fill="#4a4766">Our recommendation for a live product, not an industry standard. Urgent security fixes go out the same day.</text>
</svg>
