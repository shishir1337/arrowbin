<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">Where to start: eight workflows on one map</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">How often the job happens against what a mistake costs, for a typical small business</text>

  <!-- quadrants -->
  <rect x="220" y="170" width="480" height="215" rx="14" fill="#F1F2F7"/>
  <rect x="710" y="170" width="480" height="215" rx="14" fill="#ffe1ef"/>
  <rect x="220" y="395" width="480" height="215" rx="14" fill="#F1F2F7"/>
  <rect x="710" y="395" width="480" height="215" rx="14" fill="#e6e1ff"/>

  <text x="240" y="204" font-size="20" font-weight="700" fill="#4a4766">Keep a person in charge</text>
  <text x="1170" y="204" font-size="20" font-weight="700" fill="#c2186f" text-anchor="end">Automate with an approval step</text>
  <text x="240" y="594" font-size="20" font-weight="700" fill="#4a4766">Fine, but small payback</text>
  <text x="1170" y="594" font-size="20" font-weight="700" fill="#3b2bff" text-anchor="end">Start here</text>

  <!-- axes labels -->
  <text x="220" y="646" font-size="18" fill="#4a4766">Weekly or less</text>
  <text x="705" y="646" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">How often it happens</text>
  <text x="1190" y="646" font-size="18" fill="#4a4766" text-anchor="end">Many times a day</text>
  <text x="196" y="390" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle" transform="rotate(-90 196 390)">What a mistake costs</text>
  <text x="150" y="190" font-size="18" fill="#4a4766" text-anchor="middle">Money</text>
  <text x="150" y="212" font-size="18" fill="#4a4766" text-anchor="middle">or trust</text>
  <text x="150" y="580" font-size="18" fill="#4a4766" text-anchor="middle">Cheap</text>
  <text x="150" y="602" font-size="18" fill="#4a4766" text-anchor="middle">to catch</text>

  <!-- top-left: counter-example -->
  <circle cx="300" cy="262" r="11" fill="#ffffff" stroke="#4a4766" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="322" y="269" font-size="20" fill="#4a4766">Job quotes (not on the list)</text>

  <!-- top-right: approval step -->
  <circle cx="760" cy="262" r="11" fill="#ff4da6"/>
  <text x="782" y="269" font-size="20" font-weight="600" fill="#0e0b24">Lead qualification</text>
  <circle cx="900" cy="318" r="11" fill="#ff4da6"/>
  <text x="922" y="325" font-size="20" font-weight="600" fill="#0e0b24">Customer FAQ assistant</text>
  <circle cx="1000" cy="358" r="11" fill="#ff4da6"/>
  <text x="988" y="364" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="end">Order updates</text>

  <!-- bottom-left: small payback -->
  <circle cx="300" cy="470" r="11" fill="#4a4766"/>
  <text x="322" y="477" font-size="20" font-weight="600" fill="#0e0b24">Weekly reporting</text>
  <circle cx="470" cy="530" r="11" fill="#4a4766"/>
  <text x="492" y="537" font-size="20" font-weight="600" fill="#0e0b24">Knowledge search</text>

  <!-- bottom-right: start here -->
  <circle cx="760" cy="440" r="11" fill="#3b2bff"/>
  <text x="782" y="447" font-size="20" font-weight="600" fill="#0e0b24">Invoice and document extraction</text>
  <circle cx="1000" cy="500" r="13" fill="#3b2bff"/>
  <text x="988" y="507" font-size="20" font-weight="700" fill="#0e0b24" text-anchor="end">Inbox triage</text>
  <circle cx="860" cy="548" r="11" fill="#3b2bff"/>
  <text x="882" y="555" font-size="20" font-weight="600" fill="#0e0b24">Scheduling</text>

  <text x="80" y="690" font-size="18" fill="#4a4766">Arrowbin judgment for a typical small business. Score your own workflows: positions change by business.</text>
</svg>
