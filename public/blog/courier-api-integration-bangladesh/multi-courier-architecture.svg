<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0e0b24"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#ff4da6"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="64" y="76" font-size="40" font-weight="700" fill="#0e0b24">A custom multi-courier integration</text>
  <text x="64" y="114" font-size="24" fill="#4a4766">Orders never call a courier directly. Every courier sits behind the same adapter.</text>

  <!-- order database -->
  <rect x="60" y="150" width="210" height="490" rx="18" fill="#3b2bff"/>
  <g fill="#ffffff" text-anchor="middle">
    <text x="165" y="370" font-size="24" font-weight="700">Orders</text>
    <text x="165" y="400" font-size="18">one status model</text>
    <text x="165" y="426" font-size="18">for every courier</text>
  </g>

  <!-- courier APIs -->
  <rect x="1070" y="150" width="150" height="490" rx="18" fill="#F1F2F7" stroke="#e4e4e7" stroke-width="2"/>
  <g fill="#0e0b24" text-anchor="middle" font-size="22" font-weight="700">
    <text x="1145" y="380">Courier</text>
    <text x="1145" y="408">APIs</text>
  </g>

  <!-- outbound row -->
  <g stroke-width="2.5">
    <rect x="320" y="190" width="200" height="88" rx="16" fill="#ffffff" stroke="#0e0b24"/>
    <rect x="570" y="190" width="190" height="88" rx="16" fill="#ffffff" stroke="#0e0b24"/>
    <rect x="810" y="150" width="210" height="52" rx="12" fill="#cfc4ff" stroke="#cfc4ff"/>
    <rect x="810" y="208" width="210" height="52" rx="12" fill="#cfc4ff" stroke="#cfc4ff"/>
    <rect x="810" y="266" width="210" height="52" rx="12" fill="#cfc4ff" stroke="#cfc4ff"/>
  </g>
  <g font-size="21" font-weight="700" fill="#0e0b24" text-anchor="middle">
    <text x="420" y="228">Booking queue</text>
    <text x="665" y="228">Router</text>
  </g>
  <g font-size="18" fill="#4a4766" text-anchor="middle">
    <text x="420" y="256">one job per order</text>
    <text x="665" y="256">rules and quotes</text>
  </g>
  <g font-size="19" font-weight="600" fill="#0e0b24" text-anchor="middle">
    <text x="915" y="183">Adapter: courier A</text>
    <text x="915" y="241">Adapter: courier B</text>
    <text x="915" y="299">Adapter: courier C</text>
  </g>

  <!-- inbound row -->
  <g stroke-width="2.5">
    <rect x="320" y="380" width="200" height="88" rx="16" fill="#ffffff" stroke="#0e0b24"/>
    <rect x="570" y="380" width="190" height="88" rx="16" fill="#fff0f7" stroke="#ff4da6"/>
    <rect x="810" y="380" width="210" height="88" rx="16" fill="#ffffff" stroke="#0e0b24"/>
  </g>
  <g font-size="21" font-weight="700" fill="#0e0b24" text-anchor="middle">
    <text x="420" y="418">Status mapper</text>
    <text x="665" y="418">Confirm status</text>
    <text x="915" y="418">Webhook receiver</text>
  </g>
  <g font-size="18" fill="#4a4766" text-anchor="middle">
    <text x="420" y="446">forward-only</text>
    <text x="665" y="446">via info or track</text>
    <text x="915" y="446">reply 200, queue it</text>
  </g>

  <!-- money row -->
  <g stroke-width="2.5">
    <rect x="320" y="552" width="300" height="88" rx="16" fill="#fff6d6" stroke="#ffd23f"/>
    <rect x="680" y="552" width="340" height="88" rx="16" fill="#ffd23f" stroke="#ffd23f"/>
  </g>
  <g font-size="21" font-weight="700" fill="#0e0b24" text-anchor="middle">
    <text x="470" y="590">Payout import</text>
    <text x="850" y="590">Reconciliation report</text>
  </g>
  <g font-size="18" fill="#4a4766" text-anchor="middle">
    <text x="470" y="618">courier payout sheets</text>
    <text x="850" y="618" fill="#0e0b24">matched, unpaid, differs</text>
  </g>

  <!-- arrows -->
  <g stroke="#0e0b24" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="270" y1="234" x2="314" y2="234"/>
    <line x1="520" y1="234" x2="564" y2="234"/>
    <line x1="760" y1="220" x2="804" y2="186"/>
    <line x1="760" y1="234" x2="804" y2="234"/>
    <line x1="760" y1="248" x2="804" y2="290"/>
    <line x1="1020" y1="176" x2="1064" y2="176"/>
    <line x1="1020" y1="234" x2="1064" y2="234"/>
    <line x1="1020" y1="292" x2="1064" y2="292"/>
    <line x1="1070" y1="410" x2="1026" y2="410"/>
    <line x1="810" y1="424" x2="766" y2="424"/>
    <line x1="570" y1="424" x2="526" y2="424"/>
    <line x1="320" y1="424" x2="276" y2="424"/>
    <line x1="270" y1="596" x2="314" y2="596"/>
    <line x1="620" y1="596" x2="674" y2="596"/>
  </g>
  <path d="M665 468 V514 H1064" stroke="#ff4da6" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#p)"/>
  <text x="880" y="504" font-size="18" fill="#ff4da6" text-anchor="middle">GET parcel details before acting</text>

  <text x="64" y="694" font-size="18" fill="#4a4766">Original Arrowbin diagram. Courier A, B and C stand for any courier you add later.</text>
</svg>
