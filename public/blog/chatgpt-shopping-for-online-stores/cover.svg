    <rect x="268" y="320" width="144" height="104" rx="10" fill="#ffd23f"/>
    <use href="#shirt" x="298" y="330" width="84" height="84"/>
    <text x="270" y="450" font-size="18" font-weight="600" fill="#0e0b24">Camp collar</text>
    <text x="270" y="478" font-size="22" font-weight="700" fill="#0e0b24">$54</text>
    <rect x="328" y="461" width="82" height="24" rx="12" fill="#ffd23f"/>
    <text x="369" y="478" text-anchor="middle" font-size="14" font-weight="600" fill="#0e0b24">In stock</text>
    <rect x="270" y="504" width="140" height="40" rx="20" fill="#F1F2F7"/>
    <text x="340" y="530" text-anchor="middle" font-size="16" font-weight="700" fill="#0e0b24">Visit store</text>
  </g>
  <g>
    <rect x="432" y="310" width="164" height="252" rx="16" fill="#ffffff" stroke="#3b2bff" stroke-width="2.5"/>
    <rect x="442" y="320" width="144" height="104" rx="10" fill="#cfc4ff"/>
    <use href="#shirt" x="472" y="330" width="84" height="84"/>
    <text x="444" y="450" font-size="18" font-weight="600" fill="#0e0b24">Linen overshirt</text>
    <text x="444" y="478" font-size="22" font-weight="700" fill="#0e0b24">$48</text>
    <rect x="502" y="461" width="82" height="24" rx="12" fill="#ffd23f"/>
    <text x="543" y="478" text-anchor="middle" font-size="14" font-weight="600" fill="#0e0b24">In stock</text>
    <rect x="444" y="504" width="140" height="40" rx="20" fill="#3b2bff"/>
    <text x="514" y="530" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Visit store</text>
  </g>

  <!-- input -->
  <rect x="84" y="588" width="512" height="48" rx="24" fill="#F1F2F7"/>
  <rect x="108" y="606" width="180" height="12" rx="6" fill="#e4e4e7"/>
  <circle cx="572" cy="612" r="18" fill="#3b2bff"/>
  <path d="M572 621 L572 603 M564 610 L572 602 L580 610" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- browser window -->
