<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4a4766"/>
    </marker>
    <clipPath id="c1"><rect x="300" y="190" width="540" height="110" rx="16"/></clipPath>
    <clipPath id="c2"><rect x="300" y="335" width="540" height="110" rx="16"/></clipPath>
    <clipPath id="c3"><rect x="300" y="480" width="540" height="110" rx="16"/></clipPath>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">How a product reaches an AI shopping answer</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">Three routes in, then one click out to your checkout</text>

  <!-- catalog -->
  <rect x="60" y="190" width="190" height="400" rx="18" fill="#F1F2F7"/>
  <text x="155" y="360" text-anchor="middle" font-size="24" font-weight="700" fill="#0e0b24">Your</text>
  <text x="155" y="390" text-anchor="middle" font-size="24" font-weight="700" fill="#0e0b24">catalog</text>
  <text x="155" y="430" text-anchor="middle" font-size="18" fill="#4a4766">price, stock,</text>
  <text x="155" y="454" text-anchor="middle" font-size="18" fill="#4a4766">policies</text>

  <!-- arrows to routes -->
  <g stroke="#4a4766" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M250 300 L292 245"/>
    <path d="M250 390 L292 390"/>
    <path d="M250 480 L292 535"/>
  </g>

  <!-- routes -->
  <rect x="300" y="190" width="540" height="110" rx="16" fill="#ffffff" stroke="#3b2bff" stroke-width="3"/>
  <rect x="300" y="190" width="12" height="110" fill="#3b2bff" clip-path="url(#c1)"/>
  <text x="326" y="234" font-size="24" font-weight="700" fill="#0e0b24">1. Crawled product pages</text>
  <text x="326" y="270" font-size="19" fill="#4a4766">OAI-SearchBot, Googlebot, PerplexityBot</text>

  <rect x="300" y="335" width="540" height="110" rx="16" fill="#ffffff" stroke="#ff4da6" stroke-width="3"/>
  <rect x="300" y="335" width="12" height="110" fill="#ff4da6" clip-path="url(#c2)"/>
  <text x="326" y="379" font-size="24" font-weight="700" fill="#0e0b24">2. Product feeds</text>
  <text x="326" y="415" font-size="19" fill="#4a4766">OpenAI feed, Google and Microsoft Merchant Center</text>

  <rect x="300" y="480" width="540" height="110" rx="16" fill="#ffffff" stroke="#ff6b3d" stroke-width="3"/>
  <rect x="300" y="480" width="12" height="110" fill="#ff6b3d" clip-path="url(#c3)"/>
  <text x="326" y="524" font-size="24" font-weight="700" fill="#0e0b24">3. Platform catalogs</text>
  <text x="326" y="560" font-size="19" fill="#4a4766">Shopify Catalog, PayPal store sync</text>

  <!-- arrows to answer -->
  <g stroke="#4a4766" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M840 245 L892 285"/>
    <path d="M840 390 L892 330"/>
    <path d="M840 535 L892 360"/>
  </g>

  <!-- answer -->
  <rect x="900" y="190" width="320" height="230" rx="18" fill="#3b2bff"/>
  <text x="926" y="232" font-size="22" font-weight="700" fill="#ffffff">AI assistant answer</text>
  <rect x="926" y="252" width="128" height="140" rx="12" fill="#ffffff"/>
  <rect x="938" y="264" width="104" height="62" rx="8" fill="#cfc4ff"/>
  <rect x="938" y="338" width="80" height="12" rx="6" fill="#0e0b24"/>
  <rect x="938" y="360" width="52" height="14" rx="7" fill="#ff4da6"/>
  <rect x="1068" y="252" width="128" height="140" rx="12" fill="#ffffff"/>
  <rect x="1080" y="264" width="104" height="62" rx="8" fill="#ffd23f"/>
  <rect x="1080" y="338" width="80" height="12" rx="6" fill="#0e0b24"/>
  <rect x="1080" y="360" width="52" height="14" rx="7" fill="#ff4da6"/>

  <!-- click out -->
  <path d="M1060 420 L1060 456" stroke="#4a4766" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <rect x="900" y="464" width="320" height="76" rx="16" fill="#ffd23f"/>
  <text x="1060" y="498" text-anchor="middle" font-size="22" font-weight="700" fill="#0e0b24">Your checkout</text>
  <text x="1060" y="524" text-anchor="middle" font-size="18" fill="#0e0b24">buyer clicks through</text>
  <rect x="900" y="556" width="320" height="76" rx="16" fill="#ffffff" stroke="#4a4766" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1060" y="590" text-anchor="middle" font-size="19" font-weight="600" fill="#0e0b24">Agent checkout via</text>
  <text x="1060" y="616" text-anchor="middle" font-size="19" font-weight="600" fill="#0e0b24">ACP or UCP, if offered</text>

  <text x="80" y="680" font-size="18" fill="#4a4766">Sources: OpenAI developer docs, Google Search Central, Microsoft Advertising, Shopify, PayPal (checked Oct 15, 2026).</text>
</svg>
