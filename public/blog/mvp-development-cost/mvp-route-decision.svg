  <text x="84" y="552" font-size="26" font-weight="700" fill="#0e0b24">Prototype first</text>
  <text x="84" y="584" font-size="20" fill="#0e0b24">No-code or AI builder</text>
  <text x="84" y="614" font-size="18" fill="#4a4766">About $25–$32 a month in plan fees</text>
  <rect x="760" y="168" width="460" height="284" rx="18" fill="#3b2bff" stroke="#3b2bff" stroke-width="2"/>
  <text x="788" y="222" font-size="30" font-weight="700" fill="#ffffff">Custom MVP</text>
  <text x="788" y="282" font-size="24" font-weight="700" fill="#ffffff">Lean: $5,000–$30,000</text>
  <text x="788" y="324" font-size="24" font-weight="700" fill="#ffffff">Polished: $40,000–$120,000</text>
  <text x="788" y="374" font-size="20" fill="#e6e2ff">6–20 weeks to launch</text>
  <text x="788" y="410" font-size="18" fill="#cfc4ff">Arrowbin estimates</text>
  <rect x="760" y="512" width="460" height="128" rx="18" fill="#ffffff" stroke="#ffd23f" stroke-width="4"/>
  <text x="788" y="552" font-size="24" font-weight="700" fill="#0e0b24">It got traction?</text>
  <text x="788" y="584" font-size="20" fill="#0e0b24">Review, harden or rebuild it</text>
  <text x="788" y="614" font-size="18" fill="#4a4766">before real money and data arrive</text>
  <line x1="530" y1="224" x2="742.0" y2="224.0" stroke="#3b2bff" stroke-width="3"/>
  <polygon points="756,224 742.0,216.0 742.0,232.0" fill="#3b2bff"/>
  <text x="643" y="212" font-size="20" font-weight="700" fill="#3b2bff" text-anchor="middle">Yes</text>
  <line x1="530" y1="396" x2="742.0" y2="396.0" stroke="#3b2bff" stroke-width="3"/>
  <polygon points="756,396 742.0,388.0 742.0,404.0" fill="#3b2bff"/>
  <text x="643" y="384" font-size="20" font-weight="700" fill="#3b2bff" text-anchor="middle">Yes</text>
  <line x1="295" y1="280" x2="295.0" y2="322.0" stroke="#0e0b24" stroke-width="3"/>
  <polygon points="295,336 303.0,322.0 287.0,322.0" fill="#0e0b24"/>
  <text x="310" y="316" font-size="20" font-weight="700" fill="#0e0b24">No</text>
  <line x1="295" y1="452" x2="295.0" y2="494.0" stroke="#0e0b24" stroke-width="3"/>
  <polygon points="295,508 303.0,494.0 287.0,494.0" fill="#0e0b24"/>
  <text x="310" y="488" font-size="20" font-weight="700" fill="#0e0b24">No</text>
  <line x1="530" y1="576" x2="742.0" y2="576.0" stroke="#d81b7a" stroke-width="3"/>
  <polygon points="756,576 742.0,568.0 742.0,584.0" fill="#d81b7a"/>
  <text x="643" y="564" font-size="20" font-weight="700" fill="#d81b7a" text-anchor="middle">If it works</text>
  <line x1="990" y1="512" x2="990.0" y2="470.0" stroke="#0e0b24" stroke-width="3"/>
  <polygon points="990,456 982.0,470.0 998.0,470.0" fill="#0e0b24"/>
  <text x="60" y="690" font-size="18" fill="#4a4766">Plan fees: Lovable Pro $25 and Bubble web Starter $32, billed monthly (vendor pricing docs, October 2026).</text>
