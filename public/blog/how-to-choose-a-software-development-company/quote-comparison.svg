<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <g id="yes">
      <circle r="15" fill="#3b2bff"/>
      <path d="M-7 0 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="no">
      <circle r="15" fill="#ff6b3d"/>
      <path d="M-5.5 -5.5 l11 11 M5.5 -5.5 l-11 11" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="80" font-size="40" font-weight="700" fill="#0e0b24">Compare what is included, not the total</text>
  <text x="80" y="118" font-size="24" fill="#4a4766">Two quotes for the same product, read line by line</text>

  <rect x="80" y="150" width="540" height="500" rx="22" fill="#f1f2f7"/>
  <rect x="660" y="150" width="540" height="500" rx="22" fill="#f1f2f7"/>

  <!-- magnifier on proposal B -->
  <g fill="none" stroke="#0e0b24" stroke-width="5" stroke-linecap="round">
    <circle cx="1146" cy="190" r="16"/>
    <line x1="1158" y1="202" x2="1172" y2="216"/>
  </g>

  <g font-size="28" font-weight="700" fill="#0e0b24">
    <text x="112" y="204">Proposal A</text>
    <text x="692" y="204">Proposal B</text>
  </g>

  <!-- rows where B falls short -->
  <g fill="#ffffff" stroke="#ff6b3d" stroke-width="2">
    <rect x="676" y="230" width="508" height="50" rx="12"/>
    <rect x="676" y="402" width="508" height="50" rx="12"/>
    <rect x="676" y="460" width="508" height="50" rx="12"/>
  </g>

  <g font-size="21" fill="#0e0b24">
    <text x="112" y="262">Discovery and planning</text>
    <text x="112" y="320">UX/UI design</text>
    <text x="112" y="378">Development</text>
    <text x="112" y="436">QA and testing</text>
    <text x="112" y="494">Post-launch support</text>
    <text x="112" y="552">You own the code and IP</text>
    <text x="692" y="262">Discovery and planning</text>
    <text x="692" y="320">UX/UI design</text>
    <text x="692" y="378">Development</text>
    <text x="692" y="436">QA and testing</text>
    <text x="692" y="494">Post-launch support</text>
    <text x="692" y="552">You own the code and IP</text>
  </g>

  <use href="#yes" x="574" y="255"/>
  <use href="#yes" x="574" y="313"/>
  <use href="#yes" x="574" y="371"/>
  <use href="#yes" x="574" y="429"/>
  <use href="#yes" x="574" y="487"/>
  <use href="#yes" x="574" y="545"/>

  <use href="#no" x="1154" y="255"/>
  <use href="#yes" x="1154" y="313"/>
  <use href="#yes" x="1154" y="371"/>
  <use href="#no" x="1154" y="429"/>
  <use href="#no" x="1154" y="487"/>
  <use href="#yes" x="1154" y="545"/>

  <!-- headline price -->
  <g stroke="#e4e4e7" stroke-width="2">
    <line x1="112" y1="582" x2="588" y2="582"/>
    <line x1="692" y1="582" x2="1168" y2="582"/>
  </g>
  <g font-size="20" fill="#4a4766">
    <text x="112" y="622">Headline price</text>
    <text x="692" y="622">Headline price</text>
  </g>
  <g font-size="22" font-weight="700" text-anchor="end">
    <text x="588" y="622" fill="#0e0b24">Higher</text>
    <text x="1168" y="622" fill="#0e0b24">Lower</text>
  </g>

  <text x="80" y="690" font-size="18" fill="#4a4766">The cheaper quote leaves out the phases that prevent costly rework, so it is rarely the cheapest project.</text>
</svg>
