<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">The autonomy ladder</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">Each new automation starts at the bottom and climbs one rung at a time, on evidence</text>

  <!-- baseline -->
  <line x1="80" y1="620" x2="1200" y2="620" stroke="#e4e4e7" stroke-width="3"/>

  <!-- step 1: shadow -->
  <rect x="80" y="440" width="268" height="180" rx="16" fill="#F1F2F7"/>
  <text x="104" y="482" font-size="26" font-weight="700" fill="#0e0b24">1  Shadow</text>
  <text x="104" y="514" font-size="18" fill="#0e0b24">AI suggests; staff still</text>
  <text x="104" y="538" font-size="18" fill="#0e0b24">do the job as usual</text>
  <text x="104" y="578" font-size="18" font-weight="600" fill="#3b2bff">Climb when its suggestions</text>
  <text x="104" y="602" font-size="18" font-weight="600" fill="#3b2bff">match what staff did</text>

  <!-- step 2: approve -->
  <rect x="364" y="360" width="268" height="260" rx="16" fill="#cfc4ff"/>
  <text x="388" y="402" font-size="26" font-weight="700" fill="#0e0b24">2  Approve</text>
  <text x="388" y="434" font-size="18" fill="#0e0b24">AI drafts; a person</text>
  <text x="388" y="458" font-size="18" fill="#0e0b24">approves or edits each</text>
  <text x="388" y="498" font-size="18" font-weight="600" fill="#0e0b24">Climb when most drafts</text>
  <text x="388" y="522" font-size="18" font-weight="600" fill="#0e0b24">go out without edits</text>
  <rect x="388" y="548" width="220" height="48" rx="12" fill="#ffffff"/>
  <text x="498" y="571" font-size="18" font-weight="600" fill="#c2186f" text-anchor="middle">Refunds and legal</text>
  <text x="498" y="591" font-size="18" font-weight="600" fill="#c2186f" text-anchor="middle">replies stop here</text>

  <!-- step 3: sample -->
  <rect x="648" y="280" width="268" height="340" rx="16" fill="#3b2bff"/>
  <text x="672" y="322" font-size="26" font-weight="700" fill="#ffffff">3  Sample</text>
  <text x="672" y="354" font-size="18" fill="#ffffff">AI acts; a person checks</text>
  <text x="672" y="378" font-size="18" fill="#ffffff">a sample every day</text>
  <text x="672" y="418" font-size="18" font-weight="600" fill="#ffd23f">Climb when samples stay</text>
  <text x="672" y="442" font-size="18" font-weight="600" fill="#ffd23f">clean for several weeks</text>

  <!-- step 4: alone -->
  <rect x="932" y="200" width="268" height="420" rx="16" fill="#ff4da6"/>
  <text x="956" y="242" font-size="26" font-weight="700" fill="#ffffff">4  Alone</text>
  <text x="956" y="274" font-size="18" fill="#ffffff">AI acts without checks,</text>
  <text x="956" y="298" font-size="18" fill="#ffffff">only on cases you've</text>
  <text x="956" y="322" font-size="18" fill="#ffffff">named, such as</text>
  <text x="956" y="346" font-size="18" fill="#ffffff">order-status replies</text>
  <text x="956" y="386" font-size="18" font-weight="600" fill="#ffffff">Logs and an off switch</text>
  <text x="956" y="410" font-size="18" font-weight="600" fill="#ffffff">stay on</text>

  <text x="80" y="672" font-size="18" fill="#4a4766">Arrowbin rollout pattern. Anything that moves money or commits you legally stays at rung 2.</text>
</svg>
