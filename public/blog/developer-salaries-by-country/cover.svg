  <text x="934" y="266" font-size="52" font-weight="700" fill="#ffffff">38</text>

  <rect x="910" y="320" width="250" height="140" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <text x="934" y="360" font-size="17" fill="#4a4766">Respondents</text>
