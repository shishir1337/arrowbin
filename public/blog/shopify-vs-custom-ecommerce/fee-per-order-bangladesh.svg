<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="80" font-size="40" font-weight="700" fill="#0e0b24">Fees on one gateway-paid order in Bangladesh</text>
  <text x="80" y="118" font-size="24" fill="#4a4766">Shopify's third-party fee stacks on top of the gateway's 2.5%</text>

  <!-- legend -->
  <rect x="80" y="146" width="22" height="22" rx="4" fill="#ff4da6"/>
  <text x="112" y="164" font-size="20" fill="#0e0b24">Shopify third-party fee</text>
  <rect x="380" y="146" width="22" height="22" rx="4" fill="#3b2bff"/>
  <text x="412" y="164" font-size="20" fill="#0e0b24">SSLCommerz fee (2.5%)</text>

  <!-- gridlines: 120px per 1%, bars start at x=450 -->
  <g stroke="#e4e4e7" stroke-width="2">
    <line x1="450" y1="196" x2="450" y2="576"/>
    <line x1="570" y1="196" x2="570" y2="576"/>
    <line x1="690" y1="196" x2="690" y2="576"/>
    <line x1="810" y1="196" x2="810" y2="576"/>
    <line x1="930" y1="196" x2="930" y2="576"/>
    <line x1="1050" y1="196" x2="1050" y2="576"/>
  </g>
  <g font-size="18" fill="#4a4766" text-anchor="middle">
    <text x="450" y="600">0%</text>
    <text x="570" y="600">1%</text>
    <text x="690" y="600">2%</text>
    <text x="810" y="600">3%</text>
    <text x="930" y="600">4%</text>
    <text x="1050" y="600">5%</text>
  </g>

  <!-- row labels -->
  <g font-size="22" font-weight="600" fill="#0e0b24">
    <text x="80" y="234">Shopify Basic + SSLCommerz</text>
    <text x="80" y="314">Shopify Grow + SSLCommerz</text>
    <text x="80" y="394">Shopify Advanced + SSLCommerz</text>
    <text x="80" y="474">Custom store + SSLCommerz</text>
    <text x="80" y="554">Cash on delivery, any platform</text>
  </g>

  <!-- bars -->
  <rect x="450" y="200" width="240" height="52" fill="#ff4da6"/>
  <rect x="690" y="200" width="300" height="52" fill="#3b2bff"/>
  <rect x="450" y="280" width="120" height="52" fill="#ff4da6"/>
  <rect x="570" y="280" width="300" height="52" fill="#3b2bff"/>
  <rect x="450" y="360" width="72" height="52" fill="#ff4da6"/>
  <rect x="522" y="360" width="300" height="52" fill="#3b2bff"/>
  <rect x="450" y="440" width="300" height="52" fill="#3b2bff"/>
  <rect x="450" y="520" width="6" height="52" fill="#4a4766"/>

  <g font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="570" y="233">2%</text>
    <text x="840" y="233">2.5%</text>
    <text x="510" y="313">1%</text>
    <text x="720" y="313">2.5%</text>
    <text x="486" y="393" font-size="18">0.6%</text>
    <text x="672" y="393">2.5%</text>
    <text x="600" y="473">2.5%</text>
  </g>

  <g font-size="22" font-weight="700" fill="#0e0b24">
    <text x="1004" y="234">4.5% = BDT 90</text>
    <text x="884" y="314">3.5% = BDT 70</text>
    <text x="836" y="394">3.1% = BDT 62</text>
    <text x="764" y="474">2.5% = BDT 50</text>
    <text x="472" y="554" font-weight="600">No Shopify fee (manual payment)</text>
  </g>

  <text x="80" y="644" font-size="20" fill="#0e0b24">Example order: BDT 2,000 paid by card, bKash or Nagad through SSLCommerz. Courier COD charges not shown.</text>
  <text x="80" y="676" font-size="18" fill="#4a4766">Sources: shopify.com/pricing, sslcommerz.com/pricing, help.shopify.com manual payments (checked Oct 15, 2026)</text>
</svg>
