  <rect x="684" y="232" width="240" height="300" rx="16" fill="#cfc4ff"/>
  <use href="#shirt" x="724" y="292" width="160" height="160"/>
  <rect x="684" y="544" width="54" height="54" rx="10" fill="#cfc4ff"/>
  <rect x="746" y="544" width="54" height="54" rx="10" fill="#F1F2F7"/>
  <rect x="808" y="544" width="54" height="54" rx="10" fill="#F1F2F7"/>

  <!-- product info -->
  <rect x="948" y="240" width="90" height="10" rx="5" fill="#e4e4e7"/>
  <text x="948" y="284" font-size="24" font-weight="700" fill="#0e0b24">Linen overshirt</text>
  <text x="948" y="324" font-size="28" font-weight="700" fill="#0e0b24">$48.00</text>
  <rect x="1060" y="303" width="88" height="28" rx="14" fill="#ffd23f"/>
  <text x="1104" y="323" text-anchor="middle" font-size="15" font-weight="600" fill="#0e0b24">In stock</text>
  <g font-size="16" font-weight="600" text-anchor="middle">
    <rect x="948" y="348" width="44" height="36" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <text x="970" y="372" fill="#0e0b24">S</text>
    <rect x="1000" y="348" width="44" height="36" rx="8" fill="#ffffff" stroke="#3b2bff" stroke-width="2.5"/>
    <text x="1022" y="372" fill="#3b2bff">M</text>
    <rect x="1052" y="348" width="44" height="36" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <text x="1074" y="372" fill="#0e0b24">L</text>
    <rect x="1104" y="348" width="44" height="36" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <text x="1126" y="372" fill="#0e0b24">XL</text>
  </g>
  <rect x="948" y="402" width="248" height="50" rx="25" fill="#3b2bff"/>
  <text x="1072" y="433" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Add to cart</text>
  <rect x="948" y="472" width="248" height="10" rx="5" fill="#e4e4e7"/>
  <rect x="948" y="492" width="210" height="10" rx="5" fill="#e4e4e7"/>
  <rect x="948" y="512" width="230" height="10" rx="5" fill="#e4e4e7"/>
  <rect x="948" y="544" width="248" height="44" rx="12" fill="#F1F2F7"/>
  <rect x="964" y="560" width="14" height="12" rx="3" fill="#ff6b3d"/>
  <rect x="988" y="561" width="150" height="10" rx="5" fill="#cfc4ff"/>

  <!-- structured data chip -->
  <g filter="url(#shadow)">
    <rect x="740" y="590" width="300" height="56" rx="16" fill="#ffffff" stroke="#3b2bff" stroke-width="2"/>
  </g>
  <text x="762" y="625" font-family="Consolas, Menlo, monospace" font-size="18" fill="#0e0b24">{ "@type": <tspan fill="#ff4da6" font-weight="700">"Product"</tspan> }</text>

  <!-- click path -->
  <path d="M586 524 C 640 524, 630 452, 672 452" fill="none" stroke="#ff4da6" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#ah)"/>
</svg>
