<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="84" font-size="40" font-weight="700" fill="#0e0b24">CVE-2025-48757: the Lovable RLS scan</text>
  <text x="80" y="122" font-size="24" fill="#4a4766">Projects checked for missing or weak Row Level Security, May 2025</text>

  <!-- stacked bar: 1,645 projects, 170 vulnerable (10.3%) -->
  <text x="80" y="196" font-size="22" font-weight="600" fill="#0e0b24">1,645 projects scanned</text>
  <rect x="80" y="214" width="1120" height="96" rx="14" fill="#cfc4ff"/>
  <path d="M1084 214 H1186 A14 14 0 0 1 1200 228 V296 A14 14 0 0 1 1186 310 H1084 Z" fill="#ff4da6"/>
  <text x="104" y="272" font-size="22" font-weight="600" fill="#0e0b24">1,475 not flagged by this scan</text>
  <line x1="1142" y1="318" x2="1142" y2="346" stroke="#ff4da6" stroke-width="3"/>
  <text x="1200" y="376" font-size="22" font-weight="700" fill="#ff4da6" text-anchor="end">170 vulnerable (10.3%)</text>

  <!-- stat cards -->
  <rect x="80" y="430" width="340" height="170" rx="18" fill="#F1F2F7"/>
  <rect x="470" y="430" width="340" height="170" rx="18" fill="#F1F2F7"/>
  <rect x="860" y="430" width="340" height="170" rx="18" fill="#F1F2F7"/>
  <g font-size="64" font-weight="700">
    <text x="112" y="512" fill="#0e0b24">1,645</text>
    <text x="502" y="512" fill="#ff4da6">170</text>
    <text x="892" y="512" fill="#3b2bff">303</text>
  </g>
  <g font-size="22" fill="#4a4766">
    <text x="112" y="560">Lovable projects scanned</text>
    <text x="502" y="560">vulnerable projects</text>
    <text x="892" y="560">vulnerable endpoints</text>
  </g>

  <text x="80" y="664" font-size="20" fill="#4a4766">Source: Matt Palmer, statement on CVE-2025-48757 (29 May 2025). Cause: insufficient RLS policies.</text>
</svg>
