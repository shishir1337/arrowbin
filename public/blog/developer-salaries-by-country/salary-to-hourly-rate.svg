<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="64" y="78" font-size="40" font-weight="700" fill="#0e0b24">How a salary becomes an hourly rate</text>
  <text x="64" y="118" font-size="24" fill="#4a4766">Worked example on India's median developer pay, illustrative assumptions</text>
  <rect x="64" y="160" width="262" height="240" rx="18" fill="#F1F2F7" stroke="#cfc4ff" stroke-width="3"/>
  <text x="195.0" y="216" font-size="28" font-weight="700" fill="#0e0b24" text-anchor="middle">Yearly pay</text>
  <text x="195.0" y="290" font-size="46" font-weight="700" fill="#0e0b24" text-anchor="middle">$19,761</text>
  <text x="195.0" y="342" font-size="22" fill="#4a4766" text-anchor="middle">Survey median</text>
  <path d="M331 280.0 h24 m-11 -11 l11 11 l-11 11" stroke="#ff6b3d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="360" y="160" width="262" height="240" rx="18" fill="#F1F2F7" stroke="#cfc4ff" stroke-width="3"/>
  <text x="491.0" y="216" font-size="28" font-weight="700" fill="#0e0b24" text-anchor="middle">+ 55% costs</text>
  <text x="491.0" y="290" font-size="46" font-weight="700" fill="#0e0b24" text-anchor="middle">$30,630</text>
  <text x="491.0" y="342" font-size="22" fill="#4a4766" text-anchor="middle">30% on-costs,</text>
  <text x="491.0" y="372" font-size="22" fill="#4a4766" text-anchor="middle">25% overheads</text>
  <path d="M627 280.0 h24 m-11 -11 l11 11 l-11 11" stroke="#ff6b3d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="656" y="160" width="262" height="240" rx="18" fill="#F1F2F7" stroke="#cfc4ff" stroke-width="3"/>
  <text x="787.0" y="216" font-size="28" font-weight="700" fill="#0e0b24" text-anchor="middle">÷ 1,500 hours</text>
  <text x="787.0" y="290" font-size="46" font-weight="700" fill="#0e0b24" text-anchor="middle">$20.42</text>
  <text x="787.0" y="342" font-size="22" fill="#4a4766" text-anchor="middle">Cost per</text>
  <text x="787.0" y="372" font-size="22" fill="#4a4766" text-anchor="middle">billable hour</text>
  <path d="M923 280.0 h24 m-11 -11 l11 11 l-11 11" stroke="#ff6b3d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="952" y="160" width="262" height="240" rx="18" fill="#3b2bff"/>
  <text x="1083.0" y="216" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">÷ 0.8</text>
  <text x="1083.0" y="290" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">$25.52</text>
  <text x="1083.0" y="342" font-size="22" fill="#ffffff" text-anchor="middle">Hourly rate at</text>
  <text x="1083.0" y="372" font-size="22" fill="#ffffff" text-anchor="middle">a 20% margin</text>
  <rect x="64" y="436" width="1152" height="190" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="3"/>
  <text x="96" y="486" font-size="26" font-weight="700" fill="#0e0b24">Same formula, other medians</text>
  <text x="96" y="536" font-size="26" fill="#0e0b24">United States $155,000 → about $200/hr</text>
  <text x="96" y="580" font-size="26" fill="#0e0b24">Poland $55,040 → about $71/hr</text>
  <text x="720" y="486" font-size="26" font-weight="700" fill="#0e0b24">Shortcut with these inputs</text>
  <text x="720" y="536" font-size="26" fill="#0e0b24">Hourly rate ≈ yearly pay ÷ 774</text>
  <text x="720" y="580" font-size="26" fill="#ff4da6" font-weight="700">Not Arrowbin prices</text>
  <text x="64" y="680" font-size="22" fill="#4a4766">Assumptions are illustrative. Pay data: Stack Overflow Developer Survey 2025 and 2026.</text>
</svg>
