<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="80" font-size="40" font-weight="700" fill="#0e0b24">The 2026 cost spectrum</text>
  <text x="80" y="118" font-size="24" fill="#4a4766">Typical custom software budgets by project tier (USD)</text>

  <!-- steps -->
  <g>
    <rect x="96" y="480" width="260" height="140" rx="10" fill="#cfc4ff"/>
    <rect x="372" y="390" width="260" height="230" rx="10" fill="#ffd23f"/>
    <rect x="648" y="300" width="260" height="320" rx="10" fill="#ff4da6"/>
    <rect x="924" y="210" width="260" height="410" rx="10" fill="#3b2bff"/>
  </g>
  <line x1="80" y1="620" x2="1200" y2="620" stroke="#0e0b24" stroke-width="3"/>

  <!-- tier names -->
  <g font-size="22" font-weight="700" fill="#0e0b24" text-anchor="middle">
    <text x="226" y="434">MVP or internal tool</text>
    <text x="502" y="316">Mid-size web or</text>
    <text x="502" y="344">mobile app</text>
    <text x="778" y="254">SaaS platform</text>
    <text x="1054" y="164">Enterprise system</text>
  </g>
  <!-- price ranges -->
  <g font-size="22" fill="#4a4766" text-anchor="middle">
    <text x="226" y="464">$5,000–30,000</text>
    <text x="502" y="374">$30,000–90,000</text>
    <text x="778" y="284">$80,000–200,000</text>
    <text x="1054" y="194">$150,000–500,000+</text>
  </g>

  <!-- typical timeline, inside each step -->
  <g font-size="20" font-weight="600" text-anchor="middle">
    <text x="226" y="596" fill="#0e0b24">4–10 weeks</text>
    <text x="502" y="596" fill="#0e0b24">3–6 months</text>
    <text x="778" y="596" fill="#0e0b24">5–9 months</text>
    <text x="1054" y="596" fill="#ffffff">9–18 months</text>
  </g>

  <text x="80" y="672" font-size="18" fill="#4a4766">Source: Arrowbin estimate for planning, not a quote. Inside each step: the typical timeline.</text>
</svg>
