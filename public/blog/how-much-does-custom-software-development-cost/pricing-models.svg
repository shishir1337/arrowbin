<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="80" font-size="40" font-weight="700" fill="#0e0b24">Fixed price vs time and materials</text>
  <text x="80" y="118" font-size="24" fill="#4a4766">Neither is cheaper by default. They suit different stages of a project.</text>

  <rect x="80" y="150" width="550" height="490" rx="22" fill="#f1f2f7"/>
  <rect x="650" y="150" width="550" height="490" rx="22" fill="#f1f2f7"/>

  <!-- Fixed price icons: padlock and price tag -->
  <circle cx="152" cy="222" r="42" fill="#3b2bff"/>
  <path d="M140 216 v-10 a12 12 0 0 1 24 0 v10" fill="none" stroke="#ffffff" stroke-width="5"/>
  <rect x="134" y="214" width="36" height="28" rx="5" fill="#ffffff"/>
  <circle cx="152" cy="226" r="4" fill="#3b2bff"/>
  <circle cx="248" cy="222" r="42" fill="#ffd23f"/>
  <path d="M230 210 l18 -16 h18 v18 l-18 16 l-18 -18 z" fill="#0e0b24"/>
  <circle cx="259" cy="203" r="3.5" fill="#ffd23f"/>

  <!-- Time and materials icons: clock and sliders -->
  <circle cx="722" cy="222" r="42" fill="#ff4da6"/>
  <circle cx="722" cy="222" r="22" fill="none" stroke="#ffffff" stroke-width="5"/>
  <path d="M722 209 v13 l9 7" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="818" cy="222" r="42" fill="#cfc4ff"/>
  <g stroke="#0e0b24" stroke-width="4" stroke-linecap="round">
    <line x1="796" y1="210" x2="840" y2="210"/>
    <line x1="796" y1="234" x2="840" y2="234"/>
  </g>
  <circle cx="826" cy="210" r="7" fill="#0e0b24"/>
  <circle cx="806" cy="234" r="7" fill="#0e0b24"/>

  <!-- titles -->
  <g font-size="32" font-weight="700" fill="#0e0b24">
    <text x="112" y="318">Fixed price</text>
    <text x="682" y="318">Time and materials</text>
  </g>
  <g font-size="19" fill="#4a4766">
    <text x="112" y="348">One agreed price for a defined scope</text>
    <text x="682" y="348">You pay for the hours actually worked</text>
  </g>

  <!-- comparison rows -->
  <g stroke="#e4e4e7" stroke-width="2">
    <line x1="112" y1="372" x2="598" y2="372"/>
    <line x1="682" y1="372" x2="1168" y2="372"/>
  </g>
  <g font-size="18" fill="#4a4766">
    <text x="112" y="404">Best for</text>
    <text x="112" y="464">Budget certainty</text>
    <text x="112" y="524">Flexibility to change</text>
    <text x="112" y="584">Risk sits with</text>
    <text x="682" y="404">Best for</text>
    <text x="682" y="464">Budget certainty</text>
    <text x="682" y="524">Flexibility to change</text>
    <text x="682" y="584">Risk sits with</text>
  </g>
  <g font-size="22" font-weight="700" fill="#0e0b24">
    <text x="112" y="432">Well-defined scope, MVPs</text>
    <text x="112" y="492">High</text>
    <text x="112" y="552">Low</text>
    <text x="112" y="612">The agency</text>
    <text x="682" y="432">Evolving scope, long builds</text>
    <text x="682" y="492">Lower, but flexible</text>
    <text x="682" y="552">High</text>
    <text x="682" y="612">Shared, or the client</text>
  </g>

  <text x="80" y="684" font-size="18" fill="#4a4766">Our approach: a fixed price for a scoped MVP after discovery, then time and materials once the product is live.</text>
</svg>
