<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a4766"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="84" font-size="40" font-weight="700" fill="#0e0b24">Fix it or rebuild it?</text>
  <text x="80" y="122" font-size="24" fill="#4a4766">Ask in this order, and rebuild only the part that fails the question.</text>

  <!-- questions -->
  <g fill="#ffffff" stroke="#3b2bff" stroke-width="3">
    <rect x="80" y="168" width="540" height="84" rx="16"/>
    <rect x="80" y="316" width="540" height="84" rx="16"/>
    <rect x="80" y="464" width="540" height="84" rx="16"/>
  </g>
  <g font-size="23" font-weight="600" fill="#0e0b24">
    <text x="110" y="218">1. Is the data model sound?</text>
    <text x="110" y="366">2. Does it use a proper auth service?</text>
    <text x="110" y="514">3. Do fixes keep breaking other features?</text>
  </g>

  <!-- down arrows -->
  <g stroke="#4a4766" stroke-width="3">
    <line x1="350" y1="256" x2="350" y2="310" marker-end="url(#a)"/>
    <line x1="350" y1="404" x2="350" y2="458" marker-end="url(#a)"/>
    <line x1="350" y1="552" x2="350" y2="606" marker-end="url(#a)"/>
  </g>
  <g font-size="20" font-weight="700" fill="#3b2bff">
    <text x="366" y="290">Yes</text>
    <text x="366" y="438">Yes</text>
    <text x="366" y="586">No</text>
  </g>

  <!-- right arrows to rebuild outcomes -->
  <g stroke="#4a4766" stroke-width="3">
    <line x1="624" y1="210" x2="752" y2="210" marker-end="url(#a)"/>
    <line x1="624" y1="358" x2="752" y2="358" marker-end="url(#a)"/>
    <line x1="624" y1="506" x2="752" y2="506" marker-end="url(#a)"/>
  </g>
  <g font-size="20" font-weight="700" fill="#ff4da6" text-anchor="middle">
    <text x="688" y="198">No</text>
    <text x="688" y="346">No</text>
    <text x="688" y="494">Yes</text>
  </g>

  <!-- rebuild outcomes -->
  <g fill="#cfc4ff">
    <rect x="760" y="168" width="440" height="84" rx="16"/>
    <rect x="760" y="316" width="440" height="84" rx="16"/>
    <rect x="760" y="464" width="440" height="84" rx="16"/>
  </g>
  <g font-size="22" font-weight="700" fill="#0e0b24">
    <text x="788" y="204">Rebuild the data layer</text>
    <text x="788" y="352">Rebuild auth</text>
    <text x="788" y="500">Rebuild that module</text>
  </g>
  <g font-size="19" fill="#4a4766">
    <text x="788" y="234">Keep the screens, move them across</text>
    <text x="788" y="382">Move to Supabase Auth, Clerk or similar</text>
    <text x="788" y="530">Usually billing, auth or the core flow</text>
  </g>

  <!-- fix outcome -->
  <rect x="80" y="612" width="540" height="84" rx="16" fill="#3b2bff"/>
  <text x="110" y="662" font-size="23" font-weight="700" fill="#ffffff">Fix in place: add guards, tests, alerts</text>
  <text x="760" y="662" font-size="20" fill="#4a4766">Arrowbin rule of thumb, applied after an audit.</text>
</svg>
