    <text x="338" y="316">such as an admin</text>
    <text x="338" y="342">dashboard</text>

    <text x="908" y="314">Accounts, payments,</text>
    <text x="908" y="340">integrations, such</text>
    <text x="908" y="366">as a marketplace</text>

    <text x="338" y="560">Multi-tenancy,</text>
    <text x="338" y="586">billing, roles and</text>
    <text x="338" y="612">analytics</text>

    <text x="908" y="560">Legacy integrations,</text>
    <text x="908" y="586">security and</text>
    <text x="908" y="612">compliance</text>
