<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="80" font-size="40" font-weight="700" fill="#0e0b24">Seat fees grow with every hire</text>
  <text x="80" y="118" font-size="24" fill="#4a4766">Yearly cost of one tool at its per-seat list price, billed annually (Oct 22, 2026)</text>

  <!-- custom band: $10.5k to $36k a year -->
  <rect x="140" y="450" width="840" height="85" fill="#cfc4ff" fill-opacity="0.45"/>
  <line x1="140" y1="450" x2="980" y2="450" stroke="#3b2bff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="140" y1="535" x2="980" y2="535" stroke="#3b2bff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- grid -->
  <g stroke="#e4e4e7" stroke-width="2">
    <line x1="140" y1="470" x2="980" y2="470"/>
    <line x1="140" y1="370" x2="980" y2="370"/>
    <line x1="140" y1="270" x2="980" y2="270"/>
    <line x1="140" y1="170" x2="980" y2="170"/>
    <line x1="350" y1="170" x2="350" y2="570"/>
    <line x1="560" y1="170" x2="560" y2="570"/>
    <line x1="770" y1="170" x2="770" y2="570"/>
    <line x1="980" y1="170" x2="980" y2="570"/>
  </g>
  <line x1="140" y1="570" x2="980" y2="570" stroke="#4a4766" stroke-width="2"/>
  <line x1="140" y1="170" x2="140" y2="570" stroke="#4a4766" stroke-width="2"/>

  <g font-size="20" fill="#4a4766" text-anchor="end">
    <text x="128" y="577">$0</text>
    <text x="128" y="477">$30k</text>
    <text x="128" y="377">$60k</text>
    <text x="128" y="277">$90k</text>
    <text x="128" y="177">$120k</text>
  </g>
  <g font-size="20" fill="#4a4766" text-anchor="middle">
    <text x="140" y="600">0</text>
    <text x="350" y="600">25</text>
    <text x="560" y="600">50</text>
    <text x="770" y="600">75</text>
    <text x="980" y="600">100</text>
  </g>
  <text x="560" y="634" font-size="20" font-weight="600" fill="#0e0b24" text-anchor="middle">Seats (people who need a login)</text>

  <!-- seat lines: yearly = price x 12 x seats -->
  <line x1="140" y1="570" x2="980" y2="494" stroke="#ffd23f" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="570" x2="980" y2="390" stroke="#ff6b3d" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="570" x2="980" y2="210" stroke="#ff4da6" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="570" x2="980" y2="170" stroke="#3b2bff" stroke-width="5" stroke-linecap="round"/>

  <g font-size="20" font-weight="700" fill="#0e0b24">
    <circle cx="980" cy="170" r="7" fill="#3b2bff"/>
    <text x="996" y="177">Salesforce $100</text>
    <circle cx="980" cy="210" r="7" fill="#ff4da6"/>
    <text x="996" y="217">HubSpot $90</text>
    <circle cx="980" cy="390" r="7" fill="#ff6b3d"/>
    <text x="996" y="397">Airtable $45</text>
    <circle cx="980" cy="494" r="7" fill="#ffd23f" stroke="#0e0b24" stroke-width="1.5"/>
    <text x="996" y="501">monday.com $19</text>
  </g>

  <!-- legend -->
  <rect x="140" y="660" width="40" height="22" rx="4" fill="#cfc4ff" fill-opacity="0.8" stroke="#3b2bff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="192" y="678" font-size="20" fill="#0e0b24">Custom system: $30k–$90k build spread over 5 years, plus 15–20% a year (Arrowbin cost guide)</text>
</svg>
