  <text x="64" y="394" font-size="22" fill="#4a4766">$81k–$101k</text>
  <line x1="400" y1="372" x2="1200" y2="372" stroke="#e4e4e7" stroke-width="4" stroke-linecap="round"/>
  <rect x="805.4" y="360" width="99.9" height="24" rx="12" fill="#3b2bff"/>
  <text x="64" y="428" font-size="26" font-weight="700" fill="#0e0b24">Southern Europe</text>
  <text x="64" y="456" font-size="22" fill="#4a4766">$45k–$63k</text>
  <line x1="400" y1="434" x2="1200" y2="434" stroke="#e4e4e7" stroke-width="4" stroke-linecap="round"/>
