  <text x="64" y="332" font-size="22" fill="#4a4766">$72k–$101k</text>
  <line x1="400" y1="310" x2="1200" y2="310" stroke="#e4e4e7" stroke-width="4" stroke-linecap="round"/>
  <rect x="758.5" y="298" width="147.0" height="24" rx="12" fill="#3b2bff"/>
