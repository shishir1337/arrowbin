<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="64" y="78" font-size="40" font-weight="700" fill="#0e0b24">The spread between regions</text>
  <text x="64" y="118" font-size="24" fill="#4a4766">Lowest to highest country median in each region, USD a year</text>
  <text x="64" y="180" font-size="26" font-weight="700" fill="#0e0b24">North America</text>
  <text x="64" y="208" font-size="22" fill="#4a4766">$93k–$155k</text>
  <line x1="400" y1="186" x2="1200" y2="186" stroke="#e4e4e7" stroke-width="4" stroke-linecap="round"/>
  <rect x="865.7" y="174" width="309.3" height="24" rx="12" fill="#3b2bff"/>
  <text x="64" y="242" font-size="26" font-weight="700" fill="#0e0b24">Western Europe</text>
  <text x="64" y="270" font-size="22" fill="#4a4766">$61k–$140k</text>
  <line x1="400" y1="248" x2="1200" y2="248" stroke="#e4e4e7" stroke-width="4" stroke-linecap="round"/>
  <rect x="707.4" y="236" width="393.4" height="24" rx="12" fill="#3b2bff"/>
