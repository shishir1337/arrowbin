  </g>
  <text x="964" y="148" font-size="20" font-weight="700" fill="#0e0b24">Order #1039</text>
  <text x="964" y="172" font-size="15" fill="#4a4766">Tracking</text>
  <line x1="976" y1="214" x2="976" y2="490" stroke="#e4e4e7" stroke-width="3"/>
  <line x1="976" y1="214" x2="976" y2="352" stroke="#3b2bff" stroke-width="3"/>
  <circle cx="976" cy="214" r="11" fill="#3b2bff"/>
  <path d="M971 214l3.5 3.5 6.5-6.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="976" cy="283" r="11" fill="#3b2bff"/>
  <path d="M971 283l3.5 3.5 6.5-6.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="976" cy="352" r="13" fill="#ffffff" stroke="#ff4da6" stroke-width="4"/>
  <circle cx="976" cy="352" r="5" fill="#ff4da6"/>
  <circle cx="976" cy="421" r="10" fill="#ffffff" stroke="#cfc4ff" stroke-width="3"/>
  <circle cx="976" cy="490" r="10" fill="#ffffff" stroke="#cfc4ff" stroke-width="3"/>
  <g font-size="17" font-weight="600" fill="#0e0b24">
