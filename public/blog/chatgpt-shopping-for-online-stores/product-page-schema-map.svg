<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="82" font-size="40" font-weight="700" fill="#0e0b24">What an AI shopping crawler reads on a product page</text>
  <text x="80" y="120" font-size="24" fill="#4a4766">Visible fields mapped to Product and Offer markup, as Google classifies them</text>

  <!-- browser mock -->
  <rect x="60" y="160" width="560" height="480" rx="18" fill="#F1F2F7"/>
  <circle cx="88" cy="186" r="7" fill="#ff6b3d"/>
  <circle cx="110" cy="186" r="7" fill="#ffd23f"/>
  <circle cx="132" cy="186" r="7" fill="#cfc4ff"/>
  <rect x="156" y="174" width="440" height="26" rx="13" fill="#ffffff"/>
  <rect x="80" y="216" width="520" height="404" rx="12" fill="#ffffff"/>

  <!-- product image -->
  <rect x="100" y="236" width="210" height="250" rx="12" fill="#cfc4ff"/>
  <path d="M170 300 L190 286 L230 286 L250 300 L270 330 L252 340 L244 326 L244 440 L176 440 L176 326 L168 340 L150 330 Z" fill="#ffffff"/>

  <!-- product details -->
  <text x="348" y="262" font-size="18" fill="#4a4766">Your Brand</text>
  <text x="348" y="294" font-size="24" font-weight="700" fill="#0e0b24">Linen overshirt</text>
  <text x="348" y="334" font-size="26" font-weight="700" fill="#0e0b24">$48.00 USD</text>
  <rect x="348" y="352" width="96" height="30" rx="15" fill="#ffd23f"/>
  <text x="396" y="373" text-anchor="middle" font-size="18" font-weight="600" fill="#0e0b24">In stock</text>
  <g fill="#ff4da6">
    <path d="M356 398 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1 Z"/>
    <path d="M380 398 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1 Z"/>
    <path d="M404 398 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1 Z"/>
    <path d="M428 398 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1 Z"/>
  </g>
  <text x="454" y="418" font-size="18" fill="#4a4766">(212)</text>
  <text x="348" y="458" font-size="18" fill="#4a4766">GTIN 0123456789012</text>
  <rect x="100" y="508" width="480" height="44" rx="10" fill="#F1F2F7"/>
  <text x="118" y="537" font-size="18" fill="#0e0b24">Ships in 3 to 5 days, $5 flat</text>
  <rect x="100" y="562" width="480" height="44" rx="10" fill="#F1F2F7"/>
  <text x="118" y="591" font-size="18" fill="#0e0b24">Free returns within 30 days</text>

  <!-- number markers on mock -->
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="322" cy="288" r="13" fill="#ff4da6"/><text x="322" y="294">1</text>
    <circle cx="112" cy="248" r="13" fill="#ff4da6"/><text x="112" y="254">2</text>
    <circle cx="322" cy="328" r="13" fill="#ff4da6"/><text x="322" y="334">3</text>
    <circle cx="466" cy="367" r="13" fill="#3b2bff"/><text x="466" y="373">4</text>
    <circle cx="322" cy="256" r="13" fill="#3b2bff"/><text x="322" y="262">5</text>
    <circle cx="322" cy="452" r="13" fill="#3b2bff"/><text x="322" y="458">6</text>
    <circle cx="566" cy="530" r="13" fill="#3b2bff"/><text x="566" y="536">7</text>
    <circle cx="566" cy="584" r="13" fill="#3b2bff"/><text x="566" y="590">8</text>
    <circle cx="514" cy="412" r="13" fill="#3b2bff"/><text x="514" y="418">9</text>
  </g>

  <!-- property list -->
  <g font-size="20">
    <g font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">
      <circle cx="680" cy="182" r="14" fill="#ff4da6"/><text x="680" y="188">1</text>
      <circle cx="680" cy="232" r="14" fill="#ff4da6"/><text x="680" y="238">2</text>
      <circle cx="680" cy="282" r="14" fill="#ff4da6"/><text x="680" y="288">3</text>
      <circle cx="680" cy="332" r="14" fill="#3b2bff"/><text x="680" y="338">4</text>
      <circle cx="680" cy="382" r="14" fill="#3b2bff"/><text x="680" y="388">5</text>
      <circle cx="680" cy="432" r="14" fill="#3b2bff"/><text x="680" y="438">6</text>
      <circle cx="680" cy="482" r="14" fill="#3b2bff"/><text x="680" y="488">7</text>
      <circle cx="680" cy="532" r="14" fill="#3b2bff"/><text x="680" y="538">8</text>
      <circle cx="680" cy="582" r="14" fill="#3b2bff"/><text x="680" y="588">9</text>
    </g>
    <g fill="#0e0b24" font-weight="600">
      <text x="708" y="189">name</text>
      <text x="708" y="239">image</text>
      <text x="708" y="289">offers: price, priceCurrency</text>
      <text x="708" y="339">offers.availability</text>
      <text x="708" y="389">brand</text>
      <text x="708" y="439">gtin</text>
      <text x="708" y="489">shippingDetails</text>
      <text x="708" y="539">hasMerchantReturnPolicy</text>
      <text x="708" y="589">aggregateRating, review</text>
    </g>
    <g font-size="18" font-weight="600">
      <rect x="1074" y="166" width="140" height="32" rx="16" fill="#ff4da6"/><text x="1144" y="188" text-anchor="middle" fill="#ffffff">Required</text>
      <rect x="1074" y="216" width="140" height="32" rx="16" fill="#ff4da6"/><text x="1144" y="238" text-anchor="middle" fill="#ffffff">Required</text>
      <rect x="1074" y="266" width="140" height="32" rx="16" fill="#ff4da6"/><text x="1144" y="288" text-anchor="middle" fill="#ffffff">Required</text>
      <rect x="1044" y="316" width="170" height="32" rx="16" fill="#cfc4ff"/><text x="1129" y="338" text-anchor="middle" fill="#0e0b24">Recommended</text>
      <rect x="1044" y="366" width="170" height="32" rx="16" fill="#cfc4ff"/><text x="1129" y="388" text-anchor="middle" fill="#0e0b24">Recommended</text>
      <rect x="1044" y="416" width="170" height="32" rx="16" fill="#cfc4ff"/><text x="1129" y="438" text-anchor="middle" fill="#0e0b24">Recommended</text>
      <rect x="1044" y="466" width="170" height="32" rx="16" fill="#cfc4ff"/><text x="1129" y="488" text-anchor="middle" fill="#0e0b24">Recommended</text>
      <rect x="1044" y="516" width="170" height="32" rx="16" fill="#cfc4ff"/><text x="1129" y="538" text-anchor="middle" fill="#0e0b24">Recommended</text>
      <rect x="1044" y="566" width="170" height="32" rx="16" fill="#cfc4ff"/><text x="1129" y="588" text-anchor="middle" fill="#0e0b24">Recommended</text>
    </g>
  </g>
  <text x="666" y="632" font-size="18" fill="#4a4766">Price must be above zero, in an Offer (not AggregateOffer).</text>

  <text x="80" y="684" font-size="18" fill="#4a4766">Source: Google Search Central, merchant listing structured data (updated Sep 8, 2026). Product shown is illustrative.</text>
</svg>
