<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">What an AI crawler receives from your product page</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">The same page, rendered in the browser or on the server</text>

  <!-- left panel -->
  <rect x="80" y="170" width="545" height="440" rx="18" fill="#F1F2F7"/>
  <text x="106" y="214" font-size="24" font-weight="700" fill="#0e0b24">Client-rendered</text>
  <rect x="385" y="190" width="220" height="36" rx="18" fill="#ff6b3d"/>
  <text x="495" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">No price, no stock</text>
  <rect x="106" y="244" width="493" height="230" rx="12" fill="#ffffff"/>
  <g font-family="Consolas, Menlo, monospace" font-size="20" fill="#0e0b24">
    <text x="128" y="292">&lt;body&gt;</text>
    <text x="128" y="330">  <tspan fill="#3b2bff">&lt;div id="root"&gt;&lt;/div&gt;</tspan></text>
    <text x="128" y="368">  &lt;script src="/app.js"&gt;</text>
    <text x="128" y="406">  &lt;/script&gt;</text>
    <text x="128" y="444">&lt;/body&gt;</text>
  </g>
  <text x="106" y="520" font-size="20" fill="#0e0b24">Price, stock and markup only appear after</text>
  <text x="106" y="548" font-size="20" fill="#0e0b24">JavaScript runs. ChatGPT's and Claude's</text>
  <text x="106" y="576" font-size="20" fill="#0e0b24">crawlers fetch the script but don't run it.</text>

  <!-- right panel -->
  <rect x="655" y="170" width="545" height="440" rx="18" fill="#F1F2F7"/>
  <text x="681" y="214" font-size="24" font-weight="700" fill="#0e0b24">Server-rendered</text>
  <rect x="955" y="190" width="225" height="36" rx="18" fill="#3b2bff"/>
  <text x="1067" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Everything is there</text>
  <rect x="681" y="244" width="493" height="230" rx="12" fill="#ffffff"/>
  <g font-family="Consolas, Menlo, monospace" font-size="18" fill="#0e0b24">
    <text x="700" y="282">&lt;h1&gt;Linen overshirt&lt;/h1&gt;</text>
    <text x="700" y="312">&lt;p&gt;<tspan fill="#3b2bff" font-weight="700">$48.00</tspan> <tspan fill="#3b2bff" font-weight="700">In stock</tspan>&lt;/p&gt;</text>
    <text x="700" y="342">&lt;script type="application/ld+json"&gt;</text>
    <text x="700" y="372">{"@type": "Product",</text>
    <text x="700" y="402"> "offers": {"price": <tspan fill="#ff4da6" font-weight="700">"48.00"</tspan>,</text>
    <text x="700" y="432">  "priceCurrency": <tspan fill="#ff4da6" font-weight="700">"USD"</tspan>}}</text>
    <text x="700" y="462">&lt;/script&gt;</text>
  </g>
  <text x="681" y="520" font-size="20" fill="#0e0b24">The first HTML response already holds the</text>
  <text x="681" y="548" font-size="20" fill="#0e0b24">price, stock and Product markup, so any</text>
  <text x="681" y="576" font-size="20" fill="#0e0b24">crawler can read them without JavaScript.</text>

  <text x="80" y="668" font-size="18" fill="#4a4766">Sources: Vercel, "The rise of the AI crawler" (Dec 17, 2024); Google Search Central merchant listing docs. Example markup is illustrative.</text>
</svg>
