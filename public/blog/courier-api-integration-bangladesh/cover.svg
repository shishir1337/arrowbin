    <rect x="884" y="584" width="300" height="70" rx="18" fill="#ffffff"/>
  </g>
  <circle cx="922" cy="619" r="18" fill="#ff4da6"/>
  <path d="M913 619l6 6 12-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="952" y="613" font-size="18" font-weight="700" fill="#0e0b24">Status confirmed</text>
