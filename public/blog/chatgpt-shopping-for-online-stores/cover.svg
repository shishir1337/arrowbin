  </g>
  <path d="M660 142 a22 22 0 0 1 22 -22 h516 a22 22 0 0 1 22 22 v32 h-560 Z" fill="#F1F2F7"/>
  <circle cx="688" cy="147" r="7" fill="#ff6b3d"/>
  <circle cx="710" cy="147" r="7" fill="#ffd23f"/>
  <circle cx="732" cy="147" r="7" fill="#cfc4ff"/>
  <rect x="756" y="132" width="440" height="30" rx="15" fill="#ffffff"/>
  <rect x="772" y="141" width="10" height="9" rx="2" fill="#4a4766"/>
  <path d="M774 141 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#4a4766" stroke-width="2"/>
  <text x="792" y="153" font-size="16" fill="#4a4766">yourstore.com/products/linen-overshirt</text>

  <!-- store nav -->
  <rect x="684" y="196" width="88" height="14" rx="7" fill="#0e0b24"/>
  <rect x="980" y="198" width="52" height="10" rx="5" fill="#e4e4e7"/>
  <rect x="1046" y="198" width="52" height="10" rx="5" fill="#e4e4e7"/>
  <path d="M1170 194 h6 l4 16 h16 l3 -11 h-21" fill="none" stroke="#0e0b24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1183" cy="215" r="2.5" fill="#0e0b24"/>
  <circle cx="1194" cy="215" r="2.5" fill="#0e0b24"/>

