<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0e0b24"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="64" y="76" font-size="40" font-weight="700" fill="#0e0b24">Courier statuses as one order state machine</text>
  <text x="64" y="114" font-size="24" fill="#4a4766">Store state in bold, RedX webhook status underneath. Orders only move forward.</text>

  <!-- row A: happy path -->
  <g stroke-width="2.5">
    <rect x="60" y="160" width="250" height="92" rx="16" fill="#ffffff" stroke="#3b2bff"/>
    <rect x="360" y="160" width="250" height="92" rx="16" fill="#ffffff" stroke="#3b2bff"/>
    <rect x="660" y="160" width="250" height="92" rx="16" fill="#ffffff" stroke="#3b2bff"/>
    <rect x="960" y="160" width="250" height="92" rx="16" fill="#3b2bff" stroke="#3b2bff"/>
  </g>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="185" y="198" fill="#0e0b24">Booked</text>
    <text x="485" y="198" fill="#0e0b24">With courier</text>
    <text x="785" y="198" fill="#0e0b24">Out for delivery</text>
    <text x="1085" y="198" fill="#ffffff">Delivered</text>
  </g>
  <g font-size="18" text-anchor="middle">
    <text x="185" y="230" fill="#4a4766">tracking_id saved</text>
    <text x="485" y="230" fill="#4a4766">ready-for-delivery</text>
    <text x="785" y="230" fill="#4a4766">delivery-in-progress</text>
    <text x="1085" y="230" fill="#ffffff">delivered</text>
  </g>

  <!-- row B -->
  <g stroke-width="2.5">
    <rect x="360" y="330" width="250" height="92" rx="16" fill="#f4f2ff" stroke="#cfc4ff"/>
    <rect x="660" y="330" width="250" height="92" rx="16" fill="#f4f2ff" stroke="#cfc4ff"/>
    <rect x="960" y="330" width="250" height="92" rx="16" fill="#fff6d6" stroke="#ffd23f"/>
  </g>
  <g font-size="22" font-weight="700" text-anchor="middle" fill="#0e0b24">
    <text x="485" y="368">Address update</text>
    <text x="785" y="368">On hold</text>
    <text x="1085" y="368">COD paid</text>
  </g>
  <g font-size="18" text-anchor="middle" fill="#4a4766">
    <text x="485" y="400">agent-area-change</text>
    <text x="785" y="400">agent-hold</text>
    <text x="1085" y="400">paid</text>
  </g>

  <!-- row C -->
  <g stroke-width="2.5">
    <rect x="60" y="500" width="250" height="92" rx="16" fill="#fff0f7" stroke="#ff4da6"/>
    <rect x="360" y="500" width="250" height="92" rx="16" fill="#fff0f7" stroke="#ff4da6"/>
    <rect x="660" y="500" width="250" height="92" rx="16" fill="#fff0f7" stroke="#ff4da6"/>
    <rect x="960" y="500" width="250" height="92" rx="16" fill="#ffd23f" stroke="#ffd23f"/>
  </g>
  <g font-size="22" font-weight="700" text-anchor="middle" fill="#0e0b24">
    <text x="185" y="538">Restocked</text>
    <text x="485" y="538">Returned</text>
    <text x="785" y="538">Returning</text>
    <text x="1085" y="538">Reconciled</text>
  </g>
  <g font-size="18" text-anchor="middle" fill="#4a4766">
    <text x="185" y="570">after inspection</text>
    <text x="485" y="570">returned</text>
    <text x="785" y="570">agent-returning</text>
    <text x="1085" y="570" fill="#0e0b24">your own step</text>
  </g>

  <!-- arrows -->
  <g stroke="#0e0b24" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="310" y1="206" x2="354" y2="206"/>
    <line x1="610" y1="206" x2="654" y2="206"/>
    <line x1="910" y1="206" x2="954" y2="206"/>
    <!-- with courier to address update and back -->
    <line x1="465" y1="252" x2="465" y2="324"/>
    <line x1="505" y1="330" x2="505" y2="258"/>
    <!-- out for delivery to on hold and back -->
    <line x1="765" y1="252" x2="765" y2="324"/>
    <line x1="805" y1="330" x2="805" y2="258"/>
    <!-- on hold to returning -->
    <line x1="785" y1="422" x2="785" y2="494"/>
    <!-- returning to returned to restocked -->
    <line x1="660" y1="546" x2="616" y2="546"/>
    <line x1="360" y1="546" x2="316" y2="546"/>
    <!-- delivered to paid to reconciled -->
    <line x1="1085" y1="252" x2="1085" y2="324"/>
    <line x1="1085" y1="422" x2="1085" y2="494"/>
  </g>
  <g font-size="18" fill="#4a4766">
    <text x="815" y="296">retry</text>
    <text x="515" y="296">back</text>
  </g>

  <text x="64" y="640" font-size="20" font-weight="700" fill="#0e0b24">A late or repeated webhook never moves an order back. Unknown statuses raise an alert.</text>
  <text x="64" y="694" font-size="18" fill="#4a4766">Statuses: RedX OpenAPI documentation (redx.com.bd/developer-api), read 15 Oct 2026. Store states: Arrowbin mapping.</text>
</svg>
