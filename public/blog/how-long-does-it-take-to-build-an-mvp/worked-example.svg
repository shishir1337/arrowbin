<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="70" font-size="38" font-weight="700" fill="#0e0b24">Worked example: a 12-week SaaS MVP</text>
  <text x="80" y="108" font-size="23" fill="#4a4766">Accounts, one core workflow, billing and a simple dashboard, week by week</text>

  <!-- week gridlines -->
  <g stroke="#e4e4e7" stroke-width="1">
    <line x1="300" y1="150" x2="300" y2="590"/>
    <line x1="373.5" y1="150" x2="373.5" y2="590"/>
    <line x1="447" y1="150" x2="447" y2="590"/>
    <line x1="520.5" y1="150" x2="520.5" y2="590"/>
    <line x1="594" y1="150" x2="594" y2="590"/>
    <line x1="667.5" y1="150" x2="667.5" y2="590"/>
    <line x1="741" y1="150" x2="741" y2="590"/>
    <line x1="814.5" y1="150" x2="814.5" y2="590"/>
    <line x1="888" y1="150" x2="888" y2="590"/>
    <line x1="961.5" y1="150" x2="961.5" y2="590"/>
    <line x1="1035" y1="150" x2="1035" y2="590"/>
    <line x1="1108.5" y1="150" x2="1108.5" y2="590"/>
    <line x1="1182" y1="150" x2="1182" y2="590"/>
  </g>

  <!-- phases -->
  <g font-size="22" font-weight="700" fill="#0e0b24">
    <text x="80" y="188">Discovery</text>
    <text x="80" y="276">Design</text>
    <text x="80" y="364">Build</text>
    <text x="80" y="452">QA and polish</text>
    <text x="80" y="540">Launch</text>
  </g>
  <g font-size="18" fill="#4a4766">
    <text x="80" y="212">Weeks 1–2</text>
    <text x="80" y="300">Weeks 2–4</text>
    <text x="80" y="388">Weeks 3–10</text>
    <text x="80" y="476">Weeks 8–11</text>
    <text x="80" y="564">Week 12</text>
  </g>
  <g>
    <rect x="300" y="166" width="147" height="52" rx="10" fill="#3b2bff"/>
    <rect x="373.5" y="254" width="220.5" height="52" rx="10" fill="#ff6b3d"/>
    <rect x="447" y="342" width="588" height="52" rx="10" fill="#ff4da6"/>
    <rect x="814.5" y="430" width="294" height="52" rx="10" fill="#cfc4ff"/>
    <rect x="1108.5" y="518" width="73.5" height="52" rx="10" fill="#ffd23f"/>
  </g>
  <g font-size="17" font-weight="600">
    <text x="316" y="199" fill="#ffffff">Scope lock</text>
    <text x="389.5" y="287" fill="#0e0b24">Core screens</text>
    <text x="463" y="375" fill="#0e0b24">Auth, core workflow, billing, dashboard</text>
    <text x="830.5" y="463" fill="#0e0b24">Fixes, overlapping the build</text>
  </g>

  <!-- week axis -->
  <g font-size="18" fill="#4a4766" text-anchor="middle">
    <text x="336.8" y="618">W1</text>
    <text x="410.3" y="618">W2</text>
    <text x="483.8" y="618">W3</text>
    <text x="557.3" y="618">W4</text>
    <text x="630.8" y="618">W5</text>
    <text x="704.3" y="618">W6</text>
    <text x="777.8" y="618">W7</text>
    <text x="851.3" y="618">W8</text>
    <text x="924.8" y="618">W9</text>
    <text x="998.3" y="618">W10</text>
    <text x="1071.8" y="618">W11</text>
    <text x="1145.3" y="618">W12</text>
  </g>

  <text x="80" y="672" font-size="18" fill="#4a4766">A representative plan, not a specific client project. Phases overlap, which is what keeps an MVP fast.</text>
</svg>
