<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F2F7"/>
      <stop offset="1" stop-color="#e9e6fb"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-30%" y="-40%" width="160%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#d9d6ea"/>
    </pattern>
    <clipPath id="winA"><rect x="56" y="168" width="352" height="420" rx="16"/></clipPath>
    <clipPath id="winB"><rect x="448" y="120" width="384" height="500" rx="18"/></clipPath>
    <clipPath id="winC"><rect x="872" y="168" width="352" height="420" rx="16"/></clipPath>
    <clipPath id="hero"><rect x="502" y="252" width="144" height="84" rx="12"/></clipPath>
  </defs>

