<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="76" font-size="40" font-weight="700" fill="#0e0b24">A hybrid team: one lead in your hours</text>
  <text x="80" y="114" font-size="24" fill="#4a4766">You talk to the lead daily; the engineers overlap with the lead, not with you</text>

  <!-- card 1: you -->
  <rect x="80" y="170" width="280" height="250" rx="20" fill="#F1F2F7"/>
  <circle cx="132" cy="220" r="18" fill="#3b2bff"/>
  <path d="M106 266 a26 22 0 0 1 52 0 z" fill="#3b2bff"/>
  <text x="176" y="236" font-size="28" font-weight="700" fill="#0e0b24">You</text>
  <g font-size="20" fill="#4a4766">
    <text x="108" y="318">Business owner</text>
    <text x="108" y="352">Sets priorities</text>
    <text x="108" y="386">Approves releases</text>
  </g>

  <!-- card 2: local lead -->
  <rect x="500" y="170" width="300" height="250" rx="20" fill="#ffffff" stroke="#3b2bff" stroke-width="3"/>
  <circle cx="552" cy="220" r="18" fill="#ff4da6"/>
  <path d="M526 266 a26 22 0 0 1 52 0 z" fill="#ff4da6"/>
  <text x="596" y="236" font-size="28" font-weight="700" fill="#0e0b24">Local lead</text>
  <g font-size="20" fill="#4a4766">
    <text x="528" y="318">Product owner or tech lead</text>
    <text x="528" y="352">Works your hours</text>
    <text x="528" y="386">Writes specs, checks work</text>
  </g>

  <!-- card 3: remote engineers -->
  <rect x="940" y="170" width="260" height="250" rx="20" fill="#F1F2F7"/>
  <circle cx="1000" cy="212" r="15" fill="#cfc4ff"/>
  <path d="M976 256 a24 21 0 0 1 48 0 z" fill="#cfc4ff"/>
  <circle cx="980" cy="226" r="15" fill="#ff6b3d" stroke="#F1F2F7" stroke-width="3"/>
  <path d="M956 268 a24 21 0 0 1 48 0 z" fill="#ff6b3d" stroke="#F1F2F7" stroke-width="3"/>
  <text x="1040" y="236" font-size="28" font-weight="700" fill="#0e0b24">Engineers</text>
  <g font-size="20" fill="#4a4766">
    <text x="968" y="318">Nearshore or offshore</text>
    <text x="968" y="352">Build and test</text>
    <text x="968" y="386">Demo every week</text>
  </g>

  <!-- arrows -->
  <g stroke="#0e0b24" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="372" y1="295" x2="488" y2="295"/>
    <path d="M478 285 l10 10 l-10 10"/>
    <path d="M382 285 l-10 10 l10 10"/>
    <line x1="812" y1="295" x2="928" y2="295"/>
    <path d="M918 285 l10 10 l-10 10"/>
    <path d="M822 285 l-10 10 l10 10"/>
  </g>
  <g font-size="18" font-weight="600" fill="#0e0b24" text-anchor="middle">
    <text x="430" y="272">Daily</text>
    <text x="430" y="328">your hours</text>
    <text x="870" y="272">2–4 h overlap</text>
    <text x="870" y="328">plus specs</text>
  </g>

  <!-- owned by you -->
  <rect x="80" y="466" width="1120" height="134" rx="20" fill="#ffffff" stroke="#3b2bff" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="112" y="514" font-size="22" font-weight="700" fill="#0e0b24">Owned by your company from day one</text>
  <g fill="#cfc4ff">
    <rect x="112" y="536" width="190" height="42" rx="21"/>
    <rect x="318" y="536" width="180" height="42" rx="21"/>
    <rect x="514" y="536" width="190" height="42" rx="21"/>
    <rect x="720" y="536" width="150" height="42" rx="21"/>
    <rect x="886" y="536" width="140" height="42" rx="21"/>
  </g>
  <g font-size="18" font-weight="600" fill="#0e0b24" text-anchor="middle">
    <text x="207" y="563">Code repository</text>
    <text x="408" y="563">Cloud accounts</text>
    <text x="609" y="563">Domain and email</text>
    <text x="795" y="563">Design files</text>
    <text x="956" y="563">Task board</text>
  </g>

  <text x="80" y="660" font-size="18" fill="#4a4766">Arrowbin view. The lead only helps if they have the authority to make decisions.</text>
</svg>
