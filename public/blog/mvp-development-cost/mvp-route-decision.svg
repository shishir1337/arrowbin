<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="60" y="88" font-size="40" font-weight="700" fill="#0e0b24">Prototype first, or straight to a custom MVP?</text>
  <text x="60" y="128" font-size="24" fill="#4a4766">A quick way to pick the cheapest honest route (Arrowbin view)</text>
  <rect x="60" y="168" width="470" height="112" rx="18" fill="#F1F2F7" stroke="#cfc4ff" stroke-width="2"/>
