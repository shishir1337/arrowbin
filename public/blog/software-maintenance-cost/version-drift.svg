<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">Launch in mid-2023, never upgrade</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">By October 2026, each version has three newer releases above it</text>

  <!-- time axis: Jan 2022 (x 400) to Jan 2027 (x 1180), 13 px per month -->
  <g stroke="#e4e4e7" stroke-width="2">
    <line x1="400" y1="190" x2="400" y2="560"/>
    <line x1="556" y1="190" x2="556" y2="560"/>
    <line x1="712" y1="190" x2="712" y2="560"/>
    <line x1="868" y1="190" x2="868" y2="560"/>
    <line x1="1024" y1="190" x2="1024" y2="560"/>
    <line x1="1180" y1="190" x2="1180" y2="560"/>
  </g>
  <g font-size="18" fill="#4a4766" text-anchor="middle">
    <text x="478" y="590">2022</text>
    <text x="634" y="590">2023</text>
    <text x="790" y="590">2024</text>
    <text x="946" y="590">2025</text>
    <text x="1102" y="590">2026</text>
  </g>

  <!-- launch and today markers -->
  <line x1="634" y1="176" x2="634" y2="560" stroke="#3b2bff" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="626" y="172" font-size="18" font-weight="700" fill="#3b2bff" text-anchor="end">Launch</text>
  <line x1="1147" y1="176" x2="1147" y2="560" stroke="#ff4da6" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="1139" y="172" font-size="18" font-weight="700" fill="#0e0b24" text-anchor="end">Today</text>

  <!-- row tracks -->
  <g stroke="#e4e4e7" stroke-width="4">
    <line x1="400" y1="270" x2="1180" y2="270"/>
    <line x1="400" y1="390" x2="1180" y2="390"/>
    <line x1="400" y1="510" x2="1180" y2="510"/>
  </g>

  <!-- row labels and status -->
  <g font-size="24" font-weight="700" fill="#0e0b24">
    <text x="80" y="262">Node.js</text>
    <text x="80" y="382">PostgreSQL</text>
    <text x="80" y="502">PHP</text>
  </g>
  <g font-size="18" fill="#4a4766">
    <text x="80" y="290">20: end of life since</text>
    <text x="80" y="314">April 30, 2026</text>
    <text x="80" y="410">15: supported until</text>
    <text x="80" y="434">November 11, 2027</text>
    <text x="80" y="530">8.2: security fixes end</text>
    <text x="80" y="554">December 31, 2026</text>
  </g>

  <!-- version at launch (ring) -->
  <g fill="#ffffff" stroke="#3b2bff" stroke-width="6">
    <circle cx="595" cy="270" r="13"/>
    <circle cx="517" cy="390" r="13"/>
    <circle cx="543" cy="510" r="13"/>
  </g>
  <!-- released since (dots) -->
  <g fill="#ff4da6" stroke="#ffffff" stroke-width="3">
    <circle cx="751" cy="270" r="13"/>
    <circle cx="920" cy="270" r="13"/>
    <circle cx="1076" cy="270" r="13"/>
    <circle cx="660" cy="390" r="13"/>
    <circle cx="816" cy="390" r="13"/>
    <circle cx="972" cy="390" r="13"/>
    <circle cx="686" cy="510" r="13"/>
    <circle cx="842" cy="510" r="13"/>
    <circle cx="998" cy="510" r="13"/>
  </g>

  <!-- version labels -->
  <g font-size="20" font-weight="700" fill="#0e0b24" text-anchor="middle">
    <text x="595" y="240">20</text>
    <text x="751" y="240">22</text>
    <text x="920" y="240">24</text>
    <text x="1076" y="240">26</text>
    <text x="517" y="360">15</text>
    <text x="660" y="360">16</text>
    <text x="816" y="360">17</text>
    <text x="972" y="360">18</text>
    <text x="543" y="480">8.2</text>
    <text x="686" y="480">8.3</text>
    <text x="842" y="480">8.4</text>
    <text x="998" y="480">8.5</text>
  </g>

  <!-- legend -->
  <circle cx="92" cy="640" r="10" fill="#ffffff" stroke="#3b2bff" stroke-width="5"/>
  <text x="112" y="647" font-size="18" fill="#0e0b24">Version at launch</text>
  <circle cx="300" cy="640" r="10" fill="#ff4da6"/>
  <text x="320" y="647" font-size="18" fill="#0e0b24">Newer release line (for Node.js, even-numbered lines only)</text>

  <text x="80" y="684" font-size="18" fill="#4a4766">Sources: Node.js release schedule; PostgreSQL versioning policy; php.net supported versions</text>
</svg>
