  <line x1="890" y1="562" x2="890" y2="568" stroke="#3b2bff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="902" y1="562" x2="902" y2="568" stroke="#3b2bff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="930" y="568" font-size="14" fill="#4a4766">Next platform deadline</text>
