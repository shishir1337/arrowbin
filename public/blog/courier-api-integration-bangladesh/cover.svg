  <text x="144" y="289" font-size="17" font-weight="700" fill="#0e0b24" text-anchor="middle">RH</text>
  <text x="178" y="278" font-size="19" font-weight="700" fill="#0e0b24">R. Hasan</text>
  <text x="178" y="300" font-size="15" fill="#4a4766">017** *** 482</text>
