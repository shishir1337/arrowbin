<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="80" font-size="40" font-weight="700" fill="#0e0b24">Two published app price ladders, one axis</text>
  <text x="80" y="118" font-size="24" fill="#4a4766">Bangladeshi vendors' own estimates, in US dollars (Taka in brackets)</text>

  <!-- gridlines: $0 at x=440, 15.2px per $1k -->
  <g stroke="#e4e4e7" stroke-width="2">
    <line x1="440" y1="170" x2="440" y2="572"/>
    <line x1="592" y1="170" x2="592" y2="572"/>
    <line x1="744" y1="170" x2="744" y2="572"/>
    <line x1="896" y1="170" x2="896" y2="572"/>
    <line x1="1048" y1="170" x2="1048" y2="572"/>
    <line x1="1200" y1="170" x2="1200" y2="572"/>
  </g>
  <g font-size="19" font-weight="600" fill="#0e0b24" text-anchor="middle">
    <text x="440" y="600">$0</text>
    <text x="592" y="600">$10k</text>
    <text x="744" y="600">$20k</text>
    <text x="896" y="600">$30k</text>
    <text x="1048" y="600">$40k</text>
    <text x="1200" y="600">$50k</text>
  </g>
  <g font-size="18" fill="#4a4766" text-anchor="middle">
    <text x="440" y="624">Tk 0</text>
    <text x="592" y="624">Tk 12.4 lakh</text>
    <text x="744" y="624">Tk 24.7 lakh</text>
    <text x="896" y="624">Tk 37.1 lakh</text>
    <text x="1048" y="624">Tk 49.5 lakh</text>
    <text x="1200" y="624">Tk 61.8 lakh</text>
  </g>

  <!-- group headers -->
  <rect x="80" y="166" width="20" height="20" rx="4" fill="#3b2bff"/>
  <text x="110" y="183" font-size="20" font-weight="700" fill="#0e0b24">Bdtask, published in Taka (June 2026)</text>
  <rect x="80" y="398" width="20" height="20" rx="4" fill="#ff4da6"/>
  <text x="110" y="415" font-size="20" font-weight="700" fill="#0e0b24">Dcastalia, published in dollars (October 2025)</text>

  <!-- row labels -->
  <g font-size="21" font-weight="600" fill="#0e0b24">
    <text x="80" y="225">Basic app</text>
    <text x="80" y="271">Medium complexity app</text>
    <text x="80" y="317">Large-scale business app</text>
    <text x="80" y="363">Enterprise application</text>
    <text x="80" y="457">Simple app</text>
    <text x="80" y="503">Medium app</text>
    <text x="80" y="549">Complex app</text>
  </g>

  <!-- Bdtask bars -->
  <rect x="458" y="200" width="25" height="34" rx="5" fill="#3b2bff"/>
  <rect x="489" y="246" width="98" height="34" rx="5" fill="#3b2bff"/>
  <rect x="588" y="292" width="221" height="34" rx="5" fill="#3b2bff"/>
  <rect x="809" y="338" width="369" height="34" rx="5" fill="#3b2bff"/>
  <path d="M1182 343 l16 12 l-16 12 z" fill="#3b2bff"/>

  <!-- Dcastalia bars -->
  <rect x="470" y="432" width="46" height="34" rx="5" fill="#ff4da6"/>
  <rect x="516" y="478" width="152" height="34" rx="5" fill="#ff4da6"/>
  <rect x="668" y="524" width="92" height="34" rx="5" fill="#ff4da6"/>
  <line x1="760" y1="541" x2="842" y2="541" stroke="#ff4da6" stroke-width="4" stroke-dasharray="8 7"/>
  <path d="M842 531 l16 10 l-16 10 z" fill="#ff4da6"/>

  <!-- value labels -->
  <g font-size="19" fill="#0e0b24">
    <text x="497" y="224">Tk 1.5–3.5 lakh ($1,200–2,800)</text>
    <text x="601" y="270">Tk 4–12 lakh ($3,200–9,700)</text>
    <text x="823" y="316">Tk 12–30 lakh ($9,700–24,300)</text>
    <text x="530" y="456">$2,000–5,000 (Tk 2.5–6.2 lakh)</text>
    <text x="682" y="502">$5,000–15,000 (Tk 6.2–18.5 lakh)</text>
    <text x="872" y="548">$15,000 or more (Tk 18.5 lakh+)</text>
  </g>
  <text x="826" y="362" font-size="19" font-weight="600" fill="#ffffff">Tk 30–60 lakh+ ($24,300–48,500+)</text>

  <text x="80" y="672" font-size="19" fill="#0e0b24">Vendor estimates, not survey data. Converted at Tk 123.65 per USD (Bangladesh Bank, Oct 19, 2026).</text>
  <text x="80" y="700" font-size="18" fill="#4a4766">Sources: bdtask.com cost guide (updated Jun 28, 2026); dcastalia.com cost guide (Oct 14, 2025)</text>
</svg>
