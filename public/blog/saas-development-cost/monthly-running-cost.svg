<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" rx="24" fill="#ffffff"/>
  <text x="80" y="90" font-size="40" font-weight="700" fill="#0e0b24">Monthly running cost at three customer counts</text>
  <text x="80" y="130" font-size="24" fill="#4a4766">Share of monthly revenue. Every customer pays $50 a month on a US card.</text>

  <!-- legend -->
  <rect x="80" y="158" width="20" height="20" rx="4" fill="#3b2bff"/>
  <text x="110" y="175" font-size="20" fill="#0e0b24">Stripe processing + Billing fees</text>
  <rect x="420" y="158" width="20" height="20" rx="4" fill="#ffd23f"/>
  <text x="450" y="175" font-size="20" fill="#0e0b24">Fixed plan fees ($111 a month)</text>

  <!-- grid: bar origin x=420, 60px per 1% of revenue -->
  <g stroke="#e4e4e7" stroke-width="2">
    <line x1="420" y1="200" x2="420" y2="580"/>
    <line x1="540" y1="200" x2="540" y2="580"/>
    <line x1="660" y1="200" x2="660" y2="580"/>
    <line x1="780" y1="200" x2="780" y2="580"/>
    <line x1="900" y1="200" x2="900" y2="580"/>
  </g>
  <g font-size="20" fill="#4a4766" text-anchor="middle">
    <text x="420" y="606">0%</text>
    <text x="540" y="606">2%</text>
    <text x="660" y="606">4%</text>
    <text x="780" y="606">6%</text>
    <text x="900" y="606">8%</text>
  </g>

  <!-- row 1: 50 customers, MRR $2,500, Stripe $105 (4.2%), plans $111 (4.44%) -->
  <text x="80" y="236" font-size="22" font-weight="700" fill="#0e0b24">50 customers</text>
  <text x="80" y="264" font-size="20" fill="#4a4766">$2,500 revenue</text>
  <rect x="420" y="214" width="252" height="52" fill="#3b2bff"/>
  <rect x="672" y="214" width="266" height="52" fill="#ffd23f"/>
  <text x="546" y="248" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">$105</text>
  <text x="805" y="248" font-size="20" font-weight="700" fill="#0e0b24" text-anchor="middle">$111</text>
  <text x="956" y="248" font-size="24" font-weight="700" fill="#0e0b24">$216 (8.6%)</text>

  <!-- row 2: 200 customers, MRR $10,000, Stripe $420, plans $111 (1.11%) -->
  <text x="80" y="356" font-size="22" font-weight="700" fill="#0e0b24">200 customers</text>
  <text x="80" y="384" font-size="20" fill="#4a4766">$10,000 revenue</text>
  <rect x="420" y="334" width="252" height="52" fill="#3b2bff"/>
  <rect x="672" y="334" width="67" height="52" fill="#ffd23f"/>
  <text x="546" y="368" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">$420</text>
  <text x="705" y="368" font-size="18" font-weight="700" fill="#0e0b24" text-anchor="middle">$111</text>
  <text x="757" y="368" font-size="24" font-weight="700" fill="#0e0b24">$531 (5.3%)</text>

  <!-- row 3: 1,000 customers, MRR $50,000, Stripe $2,100, plans $111 (0.22%) -->
  <text x="80" y="476" font-size="22" font-weight="700" fill="#0e0b24">1,000 customers</text>
  <text x="80" y="504" font-size="20" fill="#4a4766">$50,000 revenue</text>
  <rect x="420" y="454" width="252" height="52" fill="#3b2bff"/>
  <rect x="672" y="454" width="13" height="52" fill="#ffd23f"/>
  <text x="546" y="488" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">$2,100</text>
  <text x="703" y="488" font-size="24" font-weight="700" fill="#0e0b24">$2,211 (4.4%)</text>
  <text x="703" y="530" font-size="18" fill="#4a4766">plans: $111</text>

  <text x="80" y="656" font-size="18" fill="#4a4766">Plan fees: Vercel Pro 2 seats $40, Supabase Pro $25, Resend Pro $20, Sentry Team $26 (billed annually).</text>
  <text x="80" y="684" font-size="18" fill="#4a4766">Stripe: 2.9% + 30¢ per US card charge, plus 0.7% Billing. Prices as listed on 15 October 2026; usage extra.</text>
</svg>
