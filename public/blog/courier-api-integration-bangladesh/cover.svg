  <g filter="url(#sh)">
    <rect x="64" y="72" width="840" height="576" rx="22" fill="#ffffff"/>
  </g>
  <path d="M86 72h796a22 22 0 0 1 22 22v30H64v-30a22 22 0 0 1 22-22z" fill="#f7f7fb"/>
  <line x1="64" y1="124" x2="904" y2="124" stroke="#e4e4e7" stroke-width="1.5"/>
